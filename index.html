<!doctype html>
<html lang="en">

<title>NEON DASH Classroom</title>
<style>
:root{--bg:#05010f;--cyan:#2ef2ff;--pink:#ff3d81;--vio:#8b5cff;--lime:#b6ff3a;--gold:#ffb531}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:#eef4ff;font-family:Arial,Helvetica,sans-serif;user-select:none;-webkit-user-select:none}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.35}
.app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 25% 20%,#1d0a58 0,transparent 35%),linear-gradient(#0d0330,#05010f)}
canvas{display:block;touch-action:none}.game{position:absolute;inset:0;width:100%;height:100%;z-index:2}
#bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background-size:cover;background-position:center}
#ytwrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;border:0}
#bgdim{position:absolute;inset:0;z-index:1;pointer-events:none;background:#05010f}
.swatch{width:38px;height:38px;border-radius:10px;border:1px solid #ffffff25}
.themebtn{padding:10px 12px;border-radius:12px;border:1px solid #ffffff20;color:#fff;font-weight:900;font-size:10px;min-width:96px}
.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(5,1,15,.4);backdrop-filter:blur(5px)}
.panel{width:min(94vw,760px);max-height:92vh;overflow:auto;padding:24px;border:1px solid rgba(139,92,255,.35);border-radius:22px;background:rgba(12,5,36,.9);box-shadow:0 24px 80px #0008;backdrop-filter:blur(18px)}
.title{margin:0;text-align:center;font-size:clamp(34px,8vw,76px);line-height:.9;font-weight:1000;letter-spacing:-3px;text-shadow:0 0 30px #2ef2ff99}.title span{display:block;color:var(--cyan)}.title b{display:block;background:linear-gradient(90deg,var(--cyan),#fff,var(--pink),var(--gold));-webkit-background-clip:text;color:transparent}
.sub{text-align:center;color:#fffb;line-height:1.5}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.center{justify-content:center}.grow{flex:1}.hidden{display:none !important}
.btn{border:1px solid #ffffff22;border-radius:12px;padding:10px 15px;background:#ffffff0b;color:#fffd;font-weight:900;letter-spacing:.6px;transition:.15s}.btn:hover:not(:disabled){transform:translateY(-1px);background:#ffffff18}.btn:active:not(:disabled){transform:scale(.97)}
.primary{border:0;background:linear-gradient(90deg,var(--cyan),var(--vio));color:#05010f;box-shadow:0 0 26px #2ef2ff55}.lime{border-color:#b6ff3a66;background:#b6ff3a16;color:var(--lime)}.gold{border-color:#ffb53166;background:#ffb53116;color:var(--gold)}.pink{border-color:#ff3d8166;background:#ff3d8116;color:var(--pink)}
.vio{border-color:#8b5cff88;background:#8b5cff20;color:#c4aaff}
.bigplay{width:88px;height:88px;border:0;border-radius:50%;background:var(--cyan);color:#05010f;font-size:13px;font-weight:1000;box-shadow:0 0 45px #2ef2ffaa;margin:18px auto;display:block;animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 0 72px #2ef2ffdd;transform:scale(1.04)}}
.small{font-size:11px;color:#fff9}.label{font-size:10px;font-weight:900;letter-spacing:2px;color:#fff8;text-transform:uppercase}
.grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.seat{padding:12px 4px;border:1px solid #ffffff18;border-radius:11px;background:#ffffff08;color:#fff;font-weight:900}.seat:hover{border-color:var(--cyan);color:var(--cyan)}
.rolecards{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:20px}.role{min-height:140px;border:1px solid #ffffff20;border-radius:18px;background:#ffffff08;color:#fff;padding:15px}.role strong{display:block;font-size:17px;margin:9px 0}.role:first-child{border-color:#2ef2ff66}.role:last-child{border-color:#ffb53166}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.level{padding:11px 7px;border:1px solid #ffffff18;border-radius:13px;background:#ffffff08;color:#fff}.level.active{border-color:var(--cyan);box-shadow:0 0 20px #2ef2ff33}.level strong{display:block;font-size:11px}.level em{font-style:normal;font-size:10px;color:#fff7}
.hud{position:absolute;inset:0;z-index:5;pointer-events:none}
.progress{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:min(46vw,400px);height:7px;border-radius:20px;background:#ffffff16;overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 15px var(--cyan)}
.pct{position:absolute;left:calc(50% + min(25vw,215px));top:10px;font-weight:900;font-size:13px}
.hudleft{position:absolute;left:14px;top:12px;font-weight:900;font-size:12px;line-height:1.7}
.lifedot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:3px;background:#ff3d81;box-shadow:0 0 8px #ff3d8199}.lifedot.gone{background:#ffffff1f;box-shadow:none}
.timer{color:var(--lime)}.timer.low{color:var(--pink)}
.pausebtn{position:absolute;right:14px;top:12px;pointer-events:auto}
.attempt{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-weight:900;letter-spacing:3px;color:#fff7;font-size:12px}
.toast{position:absolute;z-index:46;left:50%;top:66px;transform:translateX(-50%);width:min(90vw,520px);padding:14px 17px;border:1px solid #ffb53166;border-radius:15px;background:#10062eee;color:#fff;box-shadow:0 0 40px #ffb53133;text-align:center;font-weight:800}
.lock{z-index:80;background:#05010ff7;text-align:center}.gate{z-index:70;background:#0a0320f2;text-align:center}
.brief{z-index:75;background:linear-gradient(rgba(6,2,26,.55),rgba(6,2,26,.78))}
.briefpanel{border:1px solid rgba(46,242,255,.4);border-radius:24px;background:rgba(9,3,30,.82);box-shadow:0 0 70px rgba(46,242,255,.18),0 24px 80px #000a;backdrop-filter:blur(14px);padding:26px;max-height:88vh;display:flex;flex-direction:column;animation:briefin .45s cubic-bezier(.2,1.3,.4,1) both}

.brieftext{text-align:left;white-space:pre-wrap;color:#fff;overflow:auto;flex:1;min-height:0;letter-spacing:.2px}
.briefempty{text-align:center;color:#fff6;font-style:italic;padding:26px 0}
.briefhead{margin:0 0 4px;text-align:center;color:var(--cyan);letter-spacing:2px;font-weight:1000}
.briefsub{text-align:center;color:#fff7;font-size:11px;letter-spacing:2px;margin:0 0 14px;font-weight:900}
.modal{z-index:60;background:#05010fcc}.modal .panel{width:min(92vw,440px)}
.bar{height:10px;border-radius:8px;background:#ffffff14;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan));width:0}
.teacher{width:min(99vw,1240px);max-height:97vh}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.stat{padding:9px;border-radius:11px;background:#ffffff08;text-align:center;font-size:11px}.stat strong{display:block;font-size:19px;color:var(--cyan)}
.studentgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:40vh;overflow:auto;padding-right:4px}
.tile{padding:8px;border:1px solid #ffffff12;border-radius:12px;background:#ffffff07;color:#fff;text-align:left;font-size:11px}
.tile.live{border-color:#b6ff3a44}.tile.selected{border-color:var(--gold);background:#ffb53114}.tile.gate{border-color:#ffb53188;background:#ffb5310f}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff3;margin-right:5px}.live .dot{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.tname{display:block;font-weight:900;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.mini{display:block;width:100%;height:24px;margin:5px 0;border-radius:5px;background:#0005}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.controls .btn{padding:8px 10px;font-size:10px}
.input{width:100%;border:1px solid #ffffff20;border-radius:11px;background:#ffffff08;color:#fff;padding:10px 12px;outline:none}.input:focus{border-color:var(--cyan)}
textarea.input{resize:vertical;min-height:66px;font:13px/1.6 Arial}
.num{width:78px}
.card{padding:15px;margin:9px 0;border:1px solid #ffffff16;border-radius:15px;background:#ffffff06}.card h3{margin:0 0 9px;color:var(--gold);font-size:12px;letter-spacing:1.6px}
.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.choice{padding:18px;border:1px solid #ffffff20;border-radius:16px;background:#ffffff07;color:#fff;text-align:left}
.choice b{display:block;color:var(--cyan);font-size:15px;margin-bottom:5px}.choice span{font-size:11px;color:#fff9;line-height:1.5}
.steps{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.step{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start;padding:13px;border:1px solid #ffffff16;border-radius:14px;background:#ffffff05}
.stepnum{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--vio));color:#05010f;font-size:18px;font-weight:1000}
.step h4{margin:1px 0 5px;color:#fff;font-size:13px}.step p{margin:0;color:#fffb;font-size:12px;line-height:1.55}
.command{display:block;margin-top:7px;padding:9px 11px;border:1px solid #b6ff3a44;border-radius:9px;background:#020609;color:var(--lime);font:12px monospace;user-select:text;-webkit-user-select:text;white-space:pre-wrap}
.checklist{display:flex;flex-direction:column;gap:7px;margin:10px 0}.check{display:flex;gap:8px;align-items:flex-start;color:#fffb;font-size:12px;line-height:1.45}.check:before{content:'✓';display:grid;place-items:center;flex:0 0 20px;height:20px;border-radius:6px;background:#b6ff3a20;color:var(--lime);font-weight:1000}
.warn{padding:12px;border:1px solid #ffb53155;border-radius:12px;background:#ffb5310c;color:#ffe0a8;font-size:12px;line-height:1.55}
.lab{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:#070214f7}
.topbar{display:flex;gap:7px;align-items:center;padding:9px 13px;border-bottom:1px solid #ffffff16;flex-wrap:wrap}
.labtitle{font-size:16px;font-weight:1000;letter-spacing:1.5px}.labtitle b{color:var(--lime)}
.issues{min-height:32px;padding:6px 13px;color:var(--gold);font-size:11px}
.editorwrap{position:relative;flex:1;margin:0 13px;border:1px solid #ffffff18;border-radius:15px;overflow:hidden;min-height:150px}.editor{width:100%;height:100%}
.tools{display:flex;gap:6px;padding:10px 13px;overflow-x:auto}
.tool{flex:0 0 auto;padding:9px 11px;border:1px solid #ffffff16;border-radius:11px;background:#ffffff08;color:#fff9;font-size:10px;font-weight:900}.tool.active{border-color:var(--lime);background:#b6ff3a18;color:var(--lime)}
.lessons{position:absolute;inset:0;z-index:20;background:#070214f9;overflow:auto}.lessonwrap{max-width:850px;margin:auto;padding:12px}
.lesson{margin:9px 0;border:1px solid #ffffff18;border-radius:15px;background:#ffffff07}.lesson summary{cursor:pointer;padding:15px;font-weight:1000;color:#fff}.lesson div{padding:0 15px 15px;color:#fffc;line-height:1.55;font-size:13px}.lesson h4{color:var(--cyan);margin:9px 0 3px}.lesson p{margin:5px 0}
.badge{position:absolute;z-index:35;bottom:11px;padding:8px 11px;border:1px solid #ffffff20;border-radius:11px;background:#08021ddd;color:#fff;font-size:10px;font-weight:900}
.badge.b1{left:11px}.badge.b2{left:11px;bottom:52px}
.err{position:fixed;left:10px;right:10px;bottom:10px;padding:11px 15px;background:#3b0d22;color:#ffd7e8;border:1px solid #ff3d81;border-radius:11px;font:12px monospace;z-index:9999;white-space:pre-wrap}
.drop{display:block;width:100%;padding:22px 14px;border:2px dashed rgba(46,242,255,.45);border-radius:16px;background:rgba(46,242,255,.06);color:var(--cyan);text-align:center;font-weight:900;letter-spacing:1px;cursor:pointer;transition:.15s}
.drop:hover{background:rgba(46,242,255,.13);border-color:var(--cyan)}
.drop small{display:block;margin-top:6px;color:#fff7;font-weight:400;letter-spacing:0}
.track{display:flex;gap:9px;align-items:center;padding:9px 11px;border:1px solid #ffffff14;border-radius:12px;background:#ffffff06;margin:6px 0}
.track b{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.track.on{border-color:var(--lime);background:rgba(182,255,58,.10)}
.track.on b{color:var(--lime)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:13px;width:14px}
.eq i{width:3px;background:var(--lime);border-radius:1px;animation:eqb .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eqb{0%,100%{height:4px}50%{height:13px}}
input[type=range]{width:150px;accent-color:#2ef2ff}
.nowbar{padding:11px 13px;border-radius:12px;background:rgba(46,242,255,.08);border:1px solid rgba(46,242,255,.25);margin:10px 0;font-size:12px}
.version{position:fixed;right:8px;bottom:6px;z-index:4;color:#ffffff38;font:9px Arial;pointer-events:none}
@media(max-width:760px){.rolecards{grid-template-columns:1fr}.studentgrid{grid-template-columns:repeat(2,1fr)}.grid30{grid-template-columns:repeat(5,1fr)}.levels,.choicegrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:16px}.title{letter-spacing:-1px}}
</style>
</head>
<body>
<div id="app" class="app">
<div id="bg"><div id="ytwrap"></div></div>
<div id="bgdim"></div>
<canvas id="game" class="game"></canvas>
<div id="hud" class="hud hidden">
  <div class="hudleft"><span id="hudName"></span><br/><span id="hudLives"></span><br/><span id="hudTimer" class="timer"></span></div>
  <div class="progress"><i id="bar"></i></div><div id="pct" class="pct">0%</div>
  <div id="attempt" class="attempt"></div>
  <button id="pauseBtn" class="btn pausebtn">PAUSE</button>
</div>
<div id="ui"></div>
<div id="layer"></div>
<div class="version">CLASSROOM BUILD 2026.03.27.3</div>
</div>
<script>
(function(){
'use strict';
window.addEventListener('error',function(e){try{var d=document.createElement('div');d.className='err';d.textContent='ERROR: '+(e.message||'unknown');document.body.appendChild(d);}catch(x){}});
function $(s){return document.querySelector(s);}
var ui=$('#ui'),layer=$('#layer'),cv=$('#game'),ctx=cv.getContext('2d');
var C={cyan:'#2ef2ff',pink:'#ff3d81',vio:'#8b5cff',lime:'#b6ff3a',gold:'#ffb531',bg:'#05010f'};
var CELL=44,GROUND=.76,LABCOLS=120,K='ndc:',SKY=13*44;
/* Beat grid: 150 BPM, 1 beat = 4 cells = 176px, so speed 440px/s lands
   every obstacle exactly on a beat. Tap on the beat and you clear it. */
var BPM=150,SPB=60/BPM,BEATCELL=4,SPEED=BEATCELL*CELL/SPB;
var W=0,H=0,D=1,gy=0,last=0;
var mode='menu',paused=false,dead=false,won=false,levelIndex=0,level=null;
var player={x:0,y:0,vy:0,a:0,ground:true,ship:false,hold:false},cam=0,parts=[],flash=0;
var lab=[],labTool='s1',labScroll=0,painting=false,ed=null,ew=0,eh=0,edpr=1,labH=0;
var autoRelay=window.__CLASSROOM_SERVER__?((location.protocol==='https:'?'wss://':'ws://')+location.host):'';
var role=null,seat=0,name='',net=null,students=new Map(),relay=new URLSearchParams(location.search).get('relay')||autoRelay||localStorage.getItem(K+'relay')||'',netStatus=autoRelay?'connecting':'local';
var locked=false,lockText='Eyes on the teacher, please!',teacherMsg='',spot=null,consoleOpen=false,selSeat=0,conTab='class';
var teacherAuthed=false,studentAuthed=false,loginFails=0,loginLockUntil=0,hostPending=null,studentPending=null,classJoinCode='';
function serverMode(){return !!relay;}
var race=null,racePct=0,raceDone=false,raceTime=0,raceWinner='',raceSel=0,raceDeaths=0;
var GFX_PRESETS={
 basic:{name:'BASIC',round:0,glow:0,parts:.35,trail:0,grid:0,stars:0,grad:0,face:0,note:'Fastest. Flat colours, square edges, few effects. Best for older computers.'},
 standard:{name:'STANDARD',round:5,glow:12,parts:1,trail:0,grid:1,stars:0,grad:1,face:1,note:'Balanced look and speed. Recommended for most classrooms.'},
 high:{name:'HIGH DETAIL',round:11,glow:26,parts:1.7,trail:1,grid:1,stars:1,grad:1,face:1,note:'Rounded edges, strong neon glow, motion trails and extra sparks.'}};
var gfxName='standard',gfx=GFX_PRESETS.standard,trail=[];
var rules={lives:5,edits:5,minutes:5,needTest:true};
var lives=5,edits=0,tested=0,playLeft=300,designLock=false,attempt=0,showBrief=false;
var DEFAULT_BRIEF="WELCOME TO NEON DASH!\n\nTODAY YOU WILL:\n1. Play the game and work out its rules.\n2. Design your own level in the Level Lab.\n3. Test it, improve it, and share it with a friend.\n\nHOW PLAYING WORKS:\n- You get 5 lives and 5 minutes of play time.\n- When your lives or time run out, you become a DESIGNER.\n- Make 5 changes to your level and test play it once to earn 5 more lives.\n\nCONTROLS:\n- SPACE, CLICK or TAP to jump.\n- In ship mode, HOLD to rise and RELEASE to fall.\n- Press P to pause, R to restart.\n\nREMEMBER: A good level is hard but FAIR. Leave room to land!";
var brief=DEFAULT_BRIEF;
var TOOLS=[['s1','SPIKE',1],['s2','DUO',2],['s3','TRIO',3],['b1','BLOCK',1],['b2','TOWER',1],['pit','GAP',3],
 ['pad1','PAD LOW',1],['pad2','PAD MID',1],['pad3','PAD HIGH',1],
 ['ship','SHIP GATE',1],['cube','CUBE GATE',1],['erase','ERASE',1]];
/* Jump pad launch speeds. Normal jump is 900. */
var PADV={pad1:1150,pad2:1450,pad3:1800};
var PADNAME={pad1:'LOW',pad2:'MID',pad3:'HIGH'};
var LEVELS=[{name:'PULSE RIDGE',diff:'2',speed:440,ship:false},{name:'NEON DIVE',diff:'3',speed:440,ship:true},{name:'APEX PROTOCOL',diff:'5',speed:440,ship:true}];

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function save(k,v){try{localStorage.setItem(K+k,JSON.stringify(v));}catch(e){}}
function load(k,d){try{var v=localStorage.getItem(K+k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;gy=H*GROUND;ctx.setTransform(D,0,0,D,0,0);}
addEventListener('resize',resize);resize();
function fmt(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}
function isTeacher(){return role==='teacher';}
function passwordHash(value){
 var s='NEON-DASH-TEACHER|'+String(value),a=2166136261,b=2246822519,c=3266489917,d=668265263;
 for(var i=0;i<s.length;i++){var x=s.charCodeAt(i);a=Math.imul(a^x,16777619);b=Math.imul(b+x,3266489917);c=Math.imul(c^Math.imul(x+1,i+17),668265263);d=Math.imul(d^(x+i),2246822519);}
 return [a>>>0,b>>>0,c>>>0,d>>>0].map(function(n){return n.toString(16).padStart(8,'0');}).join('');}

rules=load('rules',rules);lives=load('lives',rules.lives);edits=load('edits',0);tested=load('tested',0);
playLeft=load('playLeft',rules.minutes*60);designLock=load('designLock',false);attempt=load('attempt',0);
lab=load('lab',[])||[];levelIndex=load('levelIndex',0)||0;brief=load('brief',DEFAULT_BRIEF);
gfxName=load('gfx','standard');if(!GFX_PRESETS[gfxName])gfxName='standard';gfx=GFX_PRESETS[gfxName];
function setGfx(n){if(!GFX_PRESETS[n])return;gfxName=n;gfx=GFX_PRESETS[n];save('gfx',n);trail=[];}
var savedTeacherHash=load('teacherHash','');
var teacherHash=savedTeacherHash||passwordHash('NEON2026');
var teacherPassCustom=!!savedTeacherHash;
try{teacherAuthed=sessionStorage.getItem(K+'teacherAuth')==='1';}catch(e){}
/* Server sessions must prove their code on each new connection. */
if(serverMode())teacherAuthed=false;
function classPack(){try{return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,brief:brief,rules:rules,teacherHash:teacherHash})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){return '';}}
function classLink(){return location.href.split('#')[0].split('?')[0]+'#class='+classPack();}
function readClassPack(){try{var m=location.hash.match(/class=([^&]+)/);if(!m)return;var b=m[1].replace(/-/g,'+').replace(/_/g,'/');var data=JSON.parse(decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4)))));if(data.brief!=null)brief=String(data.brief);if(data.rules)rules=data.rules;if(data.teacherHash){teacherHash=String(data.teacherHash);teacherPassCustom=true;}}catch(e){}}
readClassPack();
function persist(){save('lives',lives);save('edits',edits);save('tested',tested);save('playLeft',playLeft);save('designLock',designLock);save('attempt',attempt);save('lab',lab);save('levelIndex',levelIndex);save('rules',rules);save('brief',brief);}

(function(){var q=new URLSearchParams(location.search),w=window;

/* ---------------- network ---------------- */
function Net(url){var me=this;me.cb=function(){};me.bc=null;me.ws=null;
 /* When a server is active, every command must pass through its code check.
    BroadcastChannel is only a zero-server fallback for tabs on one device. */
 if(!serverMode())try{me.bc=new BroadcastChannel('neon-dash-classroom');me.bc.onmessage=function(e){me.cb(e.data);};}catch(e){}
 if(url){netStatus='connecting';try{me.ws=new WebSocket(url);
  me.ws.onopen=function(){netStatus='online';refreshBadges();
   setTimeout(function(){
    if(role==='student'&&(!serverMode()||studentAuthed))push();
    else if(role==='teacher'&&teacherAuthed)me.send({t:'who',brief:brief,rules:rules,teacherHash:teacherHash});
   },0);};
  me.ws.onmessage=function(e){try{me.cb(JSON.parse(e.data));}catch(x){}};
  me.ws.onerror=function(){netStatus='error';refreshBadges();};
  me.ws.onclose=function(){netStatus='error';refreshBadges();};}catch(e){netStatus='error';}}}
Net.prototype.send=function(m){try{if(this.bc)this.bc.postMessage(m);}catch(e){}try{if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify(m));}catch(e){}};
Net.prototype.close=function(){try{if(this.bc)this.bc.close();}catch(e){}try{if(this.ws)this.ws.close();}catch(e){}};
function connect(){if(!role)return;if(net)net.close();net=new Net(relay);net.cb=onNet;
 if(isTeacher()&&teacherAuthed)net.send({t:'who',brief:brief,rules:rules,teacherHash:teacherHash});
 else if(role==='student'&&(!serverMode()||studentAuthed))push();}
function onNet(m){if(!m)return;
 /* level sharing by word code - works for everyone, any role */
 if(m.t==='pub'&&m.code){pubs[m.code]=m.data;save('pubs',pubs);return;}
 if(m.t==='get'&&m.code){if(pubs[m.code]&&net)net.send({t:'got',code:m.code,data:pubs[m.code]});return;}
 if(m.t==='got'&&m.code){if(pendingGet&&pendingGet.code===m.code&&!pendingGet.done){
  pendingGet.done=true;pubs[m.code]=m.data;save('pubs',pubs);
  var f=pendingGet.cb;pendingGet=null;f(m.data);}return;}
 if(m.t==='hostres'){if(m.classCode)classJoinCode=m.classCode;hostPending&&hostPending(m);return;}
 if(m.t==='studentres'){studentPending&&studentPending(m);return;}
 if(isTeacher()&&m.t==='state'){var first=!students.has(m.s.seat);students.set(m.s.seat,m.s);
  if(first&&net){net.send({t:'cmd',target:m.s.seat,cmd:{c:'brief',text:brief,show:false}});net.send({t:'cmd',target:m.s.seat,cmd:{c:'rules',rules:rules}});net.send({t:'cmd',target:m.s.seat,cmd:{c:'teacherhash',hash:teacherHash}});net.send({t:'cmd',target:m.s.seat,cmd:{c:'gfx',name:gfxName}});
   if(race)net.send({t:'cmd',target:m.s.seat,cmd:{c:'race',id:race.id,kind:race.kind,idx:race.idx,code:race.code,title:race.title}});}
  if(race&&!raceWinner&&m.s.raceId===race.id&&m.s.raceDone){raceWinner=m.s.name||('Seat '+m.s.seat);cmd('all',{c:'racewin',name:raceWinner});}
  if(consoleOpen&&(conTab==='class'||conTab==='race'))renderConsole();return;}
 if(!isTeacher()&&m.t==='who'){if(m.brief){brief=m.brief;save('brief',brief);}if(m.rules){rules=m.rules;save('rules',rules);}if(m.teacherHash){teacherHash=m.teacherHash;teacherPassCustom=true;}push();return;}
 if(!isTeacher()&&m.t==='cmd'&&(m.target==='all'||m.target===seat))doCmd(m.cmd);}
function push(){if(role==='student'&&net&&(!serverMode()||studentAuthed))net.send({t:'state',s:{seat:seat,name:name||('Player '+seat),screen:mode,levelName:LEVELS[levelIndex].name,
 lives:lives,edits:edits,tested:tested,need:rules.edits,playLeft:Math.round(playLeft),designLock:designLock,locked:locked,
 attempts:attempt,pieces:lab.length,best:load('best'+levelIndex,0),code:lab.length?encode(lab):'',
 raceId:race?race.id:'',racePct:racePct,raceDone:raceDone,raceTime:raceTime,raceDeaths:raceDeaths,ts:Date.now()}});}
setInterval(push,1500);
function cmd(target,c){if(net)net.send({t:'cmd',target:target,cmd:c});}
function doCmd(c){
 if(c.c==='lock'){locked=c.on;if(c.text)lockText=c.text;if(locked&&mode==='play')paused=true;refreshBadges();}
 else if(c.c==='goto'){if(c.screen==='lab')openLab();else if(c.screen==='lessons')openLessons();else renderMenu();}
 else if(c.c==='msg'){teacherMsg=c.text;refreshBadges();setTimeout(function(){teacherMsg='';refreshBadges();},9000);}
 else if(c.c==='push'){var p=decode(c.code);if(p){lab=p.slice();if(p.cfg){labCfg=p.cfg;saveCfg();}persist();openLab();toast('Your teacher sent you a level!');}}
 else if(c.c==='spot'){spot=c;refreshBadges();}
 else if(c.c==='unspot'){spot=null;refreshBadges();}
 else if(c.c==='rules'){rules=c.rules;persist();if(mode==='lab')openLab();refreshBadges();}
 else if(c.c==='teacherhash'){teacherHash=String(c.hash||teacherHash);teacherPassCustom=true;}
 else if(c.c==='gfx'){setGfx(c.name);toast('Graphics set to '+gfx.name+'.');if(mode==='menu')renderMenu();}
 else if(c.c==='bg'){if(c.cfg){bgCfg=c.cfg;applyBg();toast('Your teacher changed the background.');}}
 else if(c.c==='race')startRace(c);
 else if(c.c==='raceend'){if(race){var w=c.name?('Winner: '+c.name):'Race finished';toast(w);quitRace();}}
 else if(c.c==='racewin'){raceWinner=c.name||'';if(mode==='racedone')raceFinish(true);else toast('FIRST PLACE: '+raceWinner);}
 else if(c.c==='brief'){brief=c.text;save('brief',brief);if(c.show||showBrief)renderEntryMessage();else toast('Your teacher updated the entry message.');}
 else if(c.c==='showbrief')renderEntryMessage();
 else if(c.c==='grant'){lives+=c.n;designLock=false;persist();toast('Teacher gave you '+c.n+' more lives!');if(mode==='lab')openLab();refreshBadges();}
 else if(c.c==='refill')refill(true);
 else if(c.c==='design'){lives=0;designLock=true;persist();toast('Design time! Improve your level.');openLab();}
 else if(c.c==='rename'){name=c.name;save('name',name);refreshBadges();if(mode==='menu')renderMenu();}
 else if(c.c==='reset'){lab=[];lives=rules.lives;edits=0;tested=0;playLeft=rules.minutes*60;designLock=false;persist();renderMenu();}
 push();}
function toast(t){teacherMsg=t;refreshBadges();setTimeout(function(){if(teacherMsg===t){teacherMsg='';refreshBadges();}},4000);}

/* ---------------- lives cycle ---------------- */
function canPlay(){return isTeacher()||(!designLock&&lives>0&&playLeft>0);}
function spendLife(){if(isTeacher())return;lives--;if(lives<=0){lives=0;designLock=true;}persist();}
function checkTimer(){if(isTeacher())return;if(playLeft<=0&&!designLock){designLock=true;persist();}}
function progressOk(){return edits>=rules.edits&&(!rules.needTest||tested>=1);}
function refill(force){lives=rules.lives;playLeft=rules.minutes*60;edits=0;tested=0;designLock=false;persist();
 toast(force?'Teacher refilled your lives!':'Great designing! '+rules.lives+' new lives unlocked.');
 if(mode==='lab')openLab();refreshBadges();push();}
function noteEdit(){if(isTeacher())return;edits++;persist();if(designLock&&progressOk())refill(false);}
function noteTest(){if(isTeacher())return;tested++;persist();if(designLock&&progressOk())refill(false);}

/* ---------------- run flow ---------------- */
function startPlay(){if(!canPlay()){if(designLock)openLab();return;}
 spendLife();attempt++;persist();level=makeLevel(levelIndex);beginRun();}
function startTest(){level=makeCustom();noteTest();beginRun();}
function beginRun(){mode='play';ui.innerHTML='';ui.onclick=null;layer.innerHTML='';$('#hud').classList.remove('hidden');
 $('#attempt').textContent='ATTEMPT '+attempt;$('#hudName').textContent=isTeacher()?'TEACHER':(name||('Player '+seat));
 resetRun(false);refreshHud();
 if(syn.on)synAlign(true);else if(useSynth&&audioUnlocked)synStart();
 push();}
function resetRun(attract){dead=false;won=false;paused=false;cam=0;parts=[];flash=attract?0:.3;
 player={x:0,y:(level&&level.floor)||0,vy:0,a:0,ground:true,wasG:true,sq:0,py0:0,ship:false,hold:false};if(level)level.attract=attract;}
function refreshHud(){var hl=$('#hudLives'),ht=$('#hudTimer');
 if(hl)hl.innerHTML=isTeacher()?'<span style="color:var(--gold)">UNLIMITED</span>':livesHtml();
 if(ht){ht.textContent=isTeacher()?'':('TIME '+fmt(playLeft));ht.className='timer'+(playLeft<60?' low':'');}}
function endRun(win){
 if(level&&level.race&&race){raceFinish(win);return;}
 mode=win?'win':'over';$('#hud').classList.add('hidden');
 var pc=Math.min(100,Math.round(player.x/level.end*100)),best=load('best'+levelIndex,0);
 if(!level.custom&&pc>best){best=pc;save('best'+levelIndex,best);}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeLevel(i){var o=[],col=8,r=rng(9321+i*77),L=LEVELS[i],B=BEATCELL;
 for(var n=0;n<40+i*6;n++){
  if(L.ship&&(n===14||n===32)){
   o.push({t:'ship',x:col*CELL});
   var len=B*6;
   for(var j=B*2;j<len-B;j+=B*2)o.push({t:(j/(B*2))%2?'s1':'b2',x:(col+j)*CELL});
   col+=len;o.push({t:'cube',x:col*CELL});col+=B*2;continue;}
  var k=n%12,t=k===0?'pit':k===3?'b1':k===6?'s2':k===9?'s3':r()<.22?'b2':'s1';
  o.push({t:t,x:col*CELL});
  /* gaps are whole beats: 2 beats normally, 3 for a breather, 1 for a
     quick double that clears in a single jump */
  var beats=(n>26&&n%8<3)?1:(r()<.25?3:2);
  col+=beats*B;}
 return{obs:o,end:(col+B*2)*CELL,speed:L.speed,custom:false};}
function levelFrom(arr,cfg){cfg=cfg||labCfg;
 var o=expand((arr||[]).slice().sort(function(a,b){return a.col-b.col;}),cfg.ground||0);
 o.sort(function(a,b){return a.x-b.x;});
 return{obs:o,end:(LABCOLS-6)*CELL,speed:SPEED,custom:true,
  floor:(cfg.ground||0)*CELL,roof:cfg.roof?(cfg.ground||0)*CELL+cfg.roof*CELL:0};}

function expand(arr,fc){fc=fc||0;var out=[];

  if(h>0&&t!=='pit'&&t!=='ship'&&t!=='cube'){

/* Rectangle vs triangle. A spike is a triangle with its base at y0 and
   apex CELL above. The widest part inside the player's vertical range is
   at the lowest overlapping point, so we measure the triangle there.
   SHRINK makes the hitbox smaller than the drawing, like real GD, so
   clipping the very edge of a spike does not kill you. */
var SHRINK=.58;
function spikeHit(pl,pr,pb,pt,x0,y0){
 var apex=y0+CELL;
 if(pb>=apex||pt<=y0)return false;              /* fully above or below */
 var yT=Math.max(pb,y0);                         /* lowest overlapping row */
 var frac=1-(yT-y0)/CELL;                        /* 1 at base, 0 at apex */
 var half=(CELL/2)*frac*SHRINK;
 if(half<=0)return false;
 var cx=x0+CELL/2;
 return pl<cx+half&&pr>cx-half;}
/* ---------------- collision probe (shared by game + solver) ---------------- */
function probe(lv,px,py,vy,ship,prevY){
 var obs=lv.obs,fl=lv.floor||0;
 if(prevY===undefined)prevY=py;
 var pl=px-CELL*.32,pw=CELL*.64,pr2=pl+pw,pb=py+CELL*.1,ph=CELL*.78,pt=pb+ph;
 var land=null,ceil=null,pad=null;
 /* PASS 1 - solid things only. We must know whether the player lands on a
    block BEFORE testing spikes, otherwise a spike hidden under that block
    kills a player who actually landed safely on top of it. */
 for(var i=0;i<obs.length;i++){var o=obs[i];
  if(o.x-px>CELL*4)break;
  if(px-o.x>CELL*4||o.t==='ship'||o.t==='cube')continue;
  if(o.t==='P'){
   if(box(pl,pb,pw,ph,o.x+3,o.r*CELL,CELL-6,CELL*.5))pad=o.v;
   continue;}
  if(o.t==='pit'){if(!ship&&px>o.x+4&&px<o.x+CELL*3-4&&py<=fl)return{die:true};continue;}
  var bx,by,bh;
  if(o.t==='b1'||o.t==='b2'){bx=o.x;by=fl;bh=(o.t==='b2'?2:1)*CELL;}
  else if(o.t==='B'){bx=o.x;by=o.r*CELL;bh=CELL;}
  else continue;
  var top=by+bh,tol=CELL*.45;
  /* Landing counts if we are near the top OR if we crossed straight
     through it this frame (fast falls off a high jump pad). */
  var horizontal=pl<bx+CELL&&pr2>bx;
  var onTop=horizontal&&vy<=0&&py<=top&&prevY>=top-tol;
  var underIt=horizontal&&vy>=0&&py+CELL>=by&&prevY+CELL<=by+tol;
  if(onTop){if(land===null||top>land)land=top;continue;}
  if(underIt){if(ceil===null||by<ceil)ceil=by;continue;}
  if(!box(pl,pb,pw,ph,bx,by,CELL,bh))continue;
  /* Anything else is a genuine side-on hit. */
  return{die:true};}
 /* PASS 2 - spikes, tested from where the player actually ends up.
    Standing on a block lifts the body clear of anything beneath it. */
 var ey=land!==null?land:(ceil!==null?ceil-CELL:py);
 var eb=ey+CELL*.1,et=eb+ph;
 for(var j2=0;j2<obs.length;j2++){var s2=obs[j2];
  if(s2.x-px>CELL*4)break;
  if(px-s2.x>CELL*4)continue;
  if(s2.t==='s1'||s2.t==='s2'||s2.t==='s3'){var n2=+s2.t[1];
   for(var q2=0;q2<n2;q2++)if(spikeHit(pl,pr2,eb,et,s2.x+q2*CELL,fl))return{die:true};}
  else if(s2.t==='S'){if(spikeHit(pl,pr2,eb,et,s2.x,s2.r*CELL))return{die:true};}}
 if(pad!==null)return{die:false,land:null,ceil:null,pad:pad};
 return{die:false,land:land,ceil:ceil};}

/* ---------------- solvability checker ---------------- */
function solvable(lv){
 var dt=1/60,sp=lv.speed,step=sp*dt,frames=Math.ceil(lv.end/step)+4;
 if(frames>3000)return{ok:true,x:lv.end};
 var obs=lv.obs,cur={},best=0,CAP=520,fl=lv.floor||0,rf=lv.roof||0;
 cur[fl+'|0|1|0']={y:fl,vy:0,g:1,sh:0};
 for(var f=0;f<frames;f++){
  var x=f*step;if(x>=lv.end)return{ok:true,x:lv.end};
  var nx={},count=0,empty=true;
  for(var key in cur){
   if(count>CAP)break;
   var s=cur[key];
   for(var hh=0;hh<2;hh++){
    var y=s.y,vy=s.vy,g=s.g,sh=s.sh,hold=hh===1,nxx=x+step,i;
    for(i=0;i<obs.length;i++){var o=obs[i];
     if(o.x>x&&o.x<=nxx){if(o.t==='ship'){sh=1;y=fl+CELL*2.8;vy=0;}else if(o.t==='cube'){sh=0;vy=0;}}}
    if(sh){vy+=(hold?2500:-2300)*dt;if(vy<-410)vy=-410;if(vy>340)vy=340;y+=vy*dt;
     var cy2=rf||(fl+SKY);
     if(y<fl){y=fl;vy=0;}
     else if(y+CELL>cy2){y=cy2-CELL;vy=0;}}
    else{vy-=3400*dt;y+=vy*dt;
     var cap=rf||(fl+SKY);
     if(y+CELL>cap){y=cap-CELL;if(vy>0)vy=0;}
     if(y<=fl){y=fl;vy=0;g=1;}else g=0;}
    var r=probe(lv,nxx,y,vy,sh,s.y);
    if(r.die)continue;
    if(r.pad&&!sh){vy=r.pad;g=0;}
    else if(r.land!==null){y=r.land;if(vy<0)vy=0;if(!sh)g=1;}
    else if(r.ceil!==null){y=r.ceil-CELL;if(vy>0)vy=0;}
    /* hold-to-jump resolves after landing, matching the live game */
    if(!sh&&g&&hold){vy=900;g=0;}
    var qy=Math.round(y/4),qv=Math.round(vy/70),k=qy+'|'+qv+'|'+g+'|'+sh;
    if(!nx[k]){nx[k]={y:y,vy:vy,g:g,sh:sh};count++;empty=false;}}}
  if(empty)return{ok:false,x:x};
  cur=nx;best=x;}
 return{ok:best>=lv.end*.98,x:best};}

/* ---------------- word share codes (Minecraft Education style) ----------
   Four game words instead of a long jumble. The level travels over the
   class connection, so anyone in the room can type the words and play. */
var WORDS=['SPIKE','BLOCK','TOWER','TRIO','DUO','PAD','SHIP','CUBE','GAP','DASH',
 'NEON','JUMP','WAVE','BEAT','GRID','LASER','ORBIT','PULSE','ROCKET','STAR',
 'STORM','TURBO','VOLT','ZONE','COMET','NOVA','PRISM','QUARTZ','RIFT','SOLAR',
 'TITAN','VAPOR','ZAP','ATOM','BOLT','CIRCUIT','DRIFT','ECHO','FLARE','GLIDE',
 'HELIX','IMPULSE','JETPACK','KRYPTON','LUNAR','MAGNET','NEBULA','ONYX','PIXEL','QUEST',
 'RADAR','SPARK','THRUST','ULTRA','VECTOR','WARP','XENON','YONDER','ZENITH','ANCHOR',
 'BRIDGE','CANYON','DELTA','EMBER'];
var pubs={},pendingGet=null;
function wordCode(){var a=[];for(var i=0;i<4;i++)a.push(WORDS[Math.floor(Math.random()*WORDS.length)]);return a.join(' ');}
function normCode(s){return String(s||'').toUpperCase().replace(/[^A-Z ]+/g,' ').split(/\s+/).filter(Boolean).join(' ');}
function isWordCode(s){var p=normCode(s).split(' ');
 return p.length===4&&p.every(function(w){return WORDS.indexOf(w)>=0;});}
function publishLevel(){
 if(!lab.length){alert('Build a level first.');return;}
 var code=wordCode(),data=encode(lab);
 pubs[code]=data;save('pubs',pubs);
 if(net)net.send({t:'pub',code:code,data:data});
 return code;}
function fetchByWords(code,cb){
 code=normCode(code);
 if(pubs[code])return cb(pubs[code]);
 var cached=load('pubs',{})||{};
 if(cached[code])return cb(cached[code]);
 if(!net){cb(null);return;}
 pendingGet={code:code,cb:cb,done:false};
 net.send({t:'get',code:code});
 setTimeout(function(){if(pendingGet&&pendingGet.code===code&&!pendingGet.done){
  var f=pendingGet.cb;pendingGet=null;f(null);}},3000);}
pubs=load('pubs',{})||{};

/* ---------------- built-in beat track (150 BPM, synced to the level) ----
   Every kick drum lands exactly where an obstacle can appear, so pupils
   can learn to tap on the beat instead of reacting late. ---------------- */
var A=null,NB=null,syn={on:false,step:0,next:0,timer:null,g:null};
var STEP=SPB/4;
var useSynth=load('useSynth',true);
function aCtx(){if(!A){try{A=new (window.AudioContext||window.webkitAudioContext)();}catch(e){A=null;}}return A;}
function nbuf(){if(NB)return NB;var n=Math.floor(A.sampleRate*.4),b=A.createBuffer(1,n,A.sampleRate),d=b.getChannelData(0);
 for(var i=0;i<n;i++)d[i]=Math.random()*2-1;NB=b;return b;}
function kick(t){var o=A.createOscillator(),g=A.createGain();
 o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(45,t+.09);
 g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);
 o.connect(g);g.connect(syn.g);o.start(t);o.stop(t+.26);}
function hat(t,open){var s=A.createBufferSource();s.buffer=nbuf();
 var f=A.createBiquadFilter();f.type='highpass';f.frequency.value=7600;
 var g=A.createGain();g.gain.setValueAtTime(open?.22:.13,t);
 g.gain.exponentialRampToValueAtTime(.001,t+(open?.17:.05));
 s.connect(f);f.connect(g);g.connect(syn.g);s.start(t);s.stop(t+.22);}
function snare(t){var s=A.createBufferSource();s.buffer=nbuf();
 var f=A.createBiquadFilter();f.type='bandpass';f.frequency.value=1900;
 var g=A.createGain();g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
 s.connect(f);f.connect(g);g.connect(syn.g);s.start(t);s.stop(t+.18);}
function bass(t,f,d){var o=A.createOscillator(),g=A.createGain(),lp=A.createBiquadFilter();
 o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';
 lp.frequency.setValueAtTime(1100,t);lp.frequency.exponentialRampToValueAtTime(260,t+d);
 g.gain.setValueAtTime(.34,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(lp);lp.connect(g);g.connect(syn.g);o.start(t);o.stop(t+d+.02);}
function lead(t,f,d,v){var o=A.createOscillator(),g=A.createGain();
 o.type='square';o.frequency.value=f;
 g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(syn.g);o.start(t);o.stop(t+d+.02);}
/* Am - F - C - G, the classic Newgrounds/GD progression */
var ROOTS=[55,43.65,65.41,49];
/* 16-step hook per bar. 0 = rest. Written to sit on the jump beats. */
var HOOK=[
 [440,0,523.25,0, 659.25,0,523.25,0, 440,0,392,0, 440,0,0,0],
 [349.23,0,440,0, 523.25,0,440,0, 349.23,0,329.63,0, 349.23,0,0,0],
 [523.25,0,659.25,0, 783.99,0,659.25,0, 523.25,0,493.88,0, 523.25,0,0,0],
 [493.88,0,587.33,0, 493.88,0,392,0, 440,0,493.88,0, 587.33,0,659.25,0]];
var STAB=[220,174.61,261.63,196];
function saw2(t,f,d,v){ /* detuned pair = thick supersaw lead */
 [-7,7].forEach(function(c){var o=A.createOscillator(),g=A.createGain();
  o.type='sawtooth';o.frequency.value=f;o.detune.value=c;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);
  g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(syn.g);o.start(t);o.stop(t+d+.02);});}
/* 256 steps = 16 bars. Structure like a real GD song:
   bars 0-3 intro (drums + bass), 4-11 main drop (full hook),
   bars 12-13 breakdown (lead only), 14-15 build back into the loop. */
function synStep(s,t){
 var barN=Math.floor(s/16),br=barN%4,ib=s%16;
 var intro=barN<4,brk=barN===12||barN===13,build=barN>=14;
 /* drums */
 if(!brk&&ib%4===0)kick(t);
 if(!brk&&!intro&&(ib===4||ib===12))snare(t);
 if(!brk&&ib%2===1)hat(t,ib===15);
 if(build&&ib%2===0)snare(t);            /* snare roll into the drop */
 /* sidechain pump on every kick */
 if(!brk&&ib%4===0&&syn.g){var g=syn.g.gain,v=musicVol*.75;
  g.cancelScheduledValues(t);g.setValueAtTime(v*.45,t);g.linearRampToValueAtTime(v,t+SPB*.55);}
 /* bass */
 var r=ROOTS[br];
 if(!brk){if(ib%4===0)bass(t,r,.16);if(ib%4===2&&!intro)bass(t,r*2,.11);}
 /* lead hook - the memorable part */
 if(!intro){var n=HOOK[br][ib];
  if(n)saw2(t,n,ib%4===0?.28:.18,brk?.055:.08);}
 /* chord stab */
 if(!brk&&!intro&&ib===0)lead(t,STAB[br],.3,.05);
 if(build&&ib===15)lead(t,STAB[0]*2,.25,.09);}
function synTick(){if(!A||!syn.on)return;
 while(syn.next<A.currentTime+.15){synStep(syn.step,syn.next);syn.next+=STEP;syn.step=(syn.step+1)%256;}}
function synStart(){
 if(!useSynth||musicIndex>=0||(bgCfg.type==='youtube'&&bgCfg.ytAudio))return;
 var c=aCtx();if(!c||syn.on)return;
 if(c.state==='suspended')c.resume();
 syn.g=c.createGain();syn.g.gain.value=musicVol*.75;syn.g.connect(c.destination);
 syn.on=true;syn.step=0;syn.next=c.currentTime+.08;
 syn.timer=setInterval(synTick,25);
 if(mode==='play')synAlign(true);}
/* Phase-lock the beat to the player's position in the level.
   Obstacles sit on 4-cell beats. The ideal moment to tap is about 2 cells
   BEFORE an obstacle (the jump arc carries you 5.3 cells), so we place the
   kick drum there. Tap on the kick and you clear the obstacle. */
function synAlign(reset){
 if(!A||!syn.on)return;
 var cellPos=(player.x||0)/CELL;
 var k=Math.ceil((cellPos-2)/BEATCELL-1e-6);
 var nextKick=2+k*BEATCELL;
 var wait=(nextKick-cellPos)*CELL/SPEED;
 while(wait<.03){nextKick+=BEATCELL;wait=(nextKick-cellPos)*CELL/SPEED;}
 syn.step=reset?0:(Math.ceil(syn.step/4)*4)%256;
 syn.next=A.currentTime+wait;}
function synStop(){syn.on=false;if(syn.timer)clearInterval(syn.timer);syn.timer=null;
 if(syn.g){try{syn.g.disconnect();}catch(e){}syn.g=null;}}
function synVol(){if(syn.g&&A){try{syn.g.gain.cancelScheduledValues(A.currentTime);
 syn.g.gain.setValueAtTime(musicVol*.75,A.currentTime);}catch(e){}}}

  h+='<button class="badge b2" style="color:var(--pink)" data-ov="logout">LOG OUT</button>';}
 if(isTeacher()&&!consoleOpen&&mode!=='play'){
  h+='<button class="badge b1" style="color:var(--gold)" data-ov="console">CLASS CONSOLE (T)</button>';
  h+='<button class="badge b2" style="color:var(--pink)" data-ov="logout">LOG OUT</button>';}
 if(teacherMsg)h+='<div class="toast">'+esc(teacherMsg)+'</div>';
 if(race&&raceWinner&&mode!=='racedone')h+='<div class="toast" style="border-color:#b6ff3a66;top:120px"><b style="color:var(--gold)">FIRST PLACE: '+esc(raceWinner)+'</b><br/><span class="small">Keep going and finish the race!</span></div>';
 if(designLock&&!isTeacher()&&!showBrief&&mode!=='lab'&&mode!=='play')h+='<div class="overlay gate"><div class="panel" style="max-width:460px;text-align:center">'+
  '<h2 style="color:var(--gold);margin-top:0">DESIGN TIME</h2><p class="sub">You used your lives. Improve your level to earn '+rules.lives+' more.</p>'+
  bar(Math.min(1,edits/Math.max(1,rules.edits)))+'<p class="small">'+edits+' / '+rules.edits+' changes'+(rules.needTest?' &middot; test play '+(tested>0?'done':'needed'):'')+'</p>'+
  '<button class="btn lime" data-ov="lab">OPEN LEVEL LAB</button></div></div>';
 if(locked&&role==='student')h+='<div class="overlay lock"><div><div class="label" style="color:var(--gold);font-size:16px">LOCKED BY TEACHER</div>'+
  '<h1 style="font-size:38px;margin:12px 0">EYES ON THE TEACHER</h1><p class="sub">'+esc(lockText)+'</p></div></div>';
 if(spot)h+='<div class="overlay modal"><div class="panel"><div class="row"><h2 style="margin:0;font-size:17px">SPOTLIGHT: '+esc(spot.from)+'</h2><div class="grow"></div>'+
  '<button class="btn" data-ov="unspot">CLOSE</button></div><canvas id="spotc" style="width:100%;height:140px;background:#0004;border-radius:11px"></canvas></div></div>';
 layer.innerHTML=h;
 layer.onclick=function(e){var b=e.target.closest('[data-ov]');if(!b)return;var k=b.dataset.ov;
  if(k==='name')editName();
  else if(k==='console')renderConsole();
  else if(k==='logout')logout();
  else if(k==='lab'){showBrief=false;openLab();}
  else if(k==='unspot'){spot=null;refreshBadges();}};
 var sc=$('#spotc');if(sc&&spot)setTimeout(function(){mini(sc,decode(spot.code)||[]);},40);}

/* ---------------- boot ---------------- */
applyBg();sizeYT();loadMusic();
if(!role)renderRole();
else if(role==='teacher'&&!teacherAuthed){
 /* connect first: the hosting code is verified by the server */
 connect();renderTeacherLogin();}
else if(role==='student'&&serverMode()&&!studentAuthed){
 connect();renderStudentLogin();}
else{connect();renderEntryMessage();}
})();
</script>
</body>
</html>
