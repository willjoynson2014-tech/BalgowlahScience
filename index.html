<style>

.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff3;margin-right:5px}.live .dot{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.tname{display:block;font-weight:900;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}

.controls{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.controls .btn{padding:8px 10px;font-size:10px}
.input{width:100%;border:1px solid #ffffff20;border-radius:11px;background:#ffffff08;color:#fff;padding:10px 12px;outline:none}.input:focus{border-color:var(--cyan)}
textarea.input{resize:vertical;min-height:66px;font:13px/1.6 Arial}
.num{width:78px}

.steps{display:flex;flex-direction:column;gap:10px;margin:12px 0}

.stepnum{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--vio));color:#05010f;font-size:18px;font-weight:1000}

.command{display:block;margin-top:7px;padding:9px 11px;border:1px solid #b6ff3a44;border-radius:9px;background:#020609;color:var(--lime);font:12px monospace;user-select:text;-webkit-user-select:text;white-space:pre-wrap}
.checklist{display:flex;flex-direction:column;gap:7px;margin:10px 0}.check{display:flex;gap:8px;align-items:flex-start;color:#fffb;font-size:12px;line-height:1.45}.check:before{content:'✓';display:grid;place-items:center;flex:0 0 20px;height:20px;border-radius:6px;background:#b6ff3a20;color:var(--lime);font-weight:1000}
.warn{padding:12px;border:1px solid #ffb53155;border-radius:12px;background:#ffb5310c;color:#ffe0a8;font-size:12px;line-height:1.55}
.lab{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:#070214f7}
.topbar{display:flex;gap:7px;align-items:center;padding:9px 13px;border-bottom:1px solid #ffffff16;flex-wrap:wrap}
.labtitle{font-size:16px;font-weight:1000;letter-spacing:1.5px}.labtitle b{color:var(--lime)}
.issues{min-height:32px;padding:6px 13px;color:var(--gold);font-size:11px}
.editorwrap{position:relative;flex:1;margin:0 13px;border:1px solid #ffffff18;border-radius:15px;overflow:hidden;min-height:150px}.editor{width:100%;height:100%}
.tools{display:flex;gap:6px;padding:10px 13px;overflow-x:auto}
.tool{flex:0 0 auto;padding:9px 11px;border:1px solid #ffffff16;border-radius:11px;background:#ffffff08;color:#fff9;font-size:10px;font-weight:900}.tool.active{border-color:var(--lime);background:#b6ff3a18;color:var(--lime)}
.lessons{position:absolute;inset:0;z-index:20;background:#070214f9;overflow:auto}.lessonwrap{max-width:850px;margin:auto;padding:12px}
.lesson{margin:9px 0;border:1px solid #ffffff18;border-radius:15px;background:#ffffff07}.lesson summary{cursor:pointer;padding:15px;font-weight:1000;color:#fff}.lesson div{padding:0 15px 15px;color:#fffc;line-height:1.55;font-size:13px}.lesson h4{color:var(--cyan);margin:9px 0 3px}.lesson p{margin:5px 0}
.badge{position:absolute;z-index:35;bottom:11px;padding:8px 11px;border:1px solid #ffffff20;border-radius:11px;background:#08021ddd;color:#fff;font-size:10px;font-weight:900}
.badge.b1{left:11px}.badge.b2{left:11px;bottom:52px}

.drop{display:block;width:100%;padding:22px 14px;border:2px dashed rgba(46,242,255,.45);border-radius:16px;background:rgba(46,242,255,.06);color:var(--cyan);text-align:center;font-weight:900;letter-spacing:1px;cursor:pointer;transition:.15s}
.drop:hover{background:rgba(46,242,255,.13);border-color:var(--cyan)}
.drop small{display:block;margin-top:6px;color:#fff7;font-weight:400;letter-spacing:0}
.track{display:flex;gap:9px;align-items:center;padding:9px 11px;border:1px solid #ffffff14;border-radius:12px;background:#ffffff06;margin:6px 0}
.track b{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.track.on{border-color:var(--lime);background:rgba(182,255,58,.10)}
.track.on b{color:var(--lime)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:13px;width:14px}
.eq i{width:3px;background:var(--lime);border-radius:1px;animation:eqb .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eqb{0%,100%{height:4px}50%{height:13px}}
input[type=range]{width:150px;accent-color:#2ef2ff}
.nowbar{padding:11px 13px;border-radius:12px;background:rgba(46,242,255,.08);border:1px solid rgba(46,242,255,.25);margin:10px 0;font-size:12px}
.version{position:fixed;right:8px;bottom:6px;z-index:4;color:#ffffff38;font:9px Arial;pointer-events:none}
@media(max-width:760px){.rolecards{grid-template-columns:1fr}.studentgrid{grid-template-columns:repeat(2,1fr)}.grid30{grid-template-columns:repeat(5,1fr)}.levels,.choicegrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:16px}.title{letter-spacing:-1px}}
@media(pointer:coarse){.btn{padding:12px 17px}.seat,.tile{min-height:46px}}
@media print{.version,.badge,.hud{display:none!important}}

<body>
<div id="app" class="app">
<div id="bg"><div id="ytwrap"></div></div>
<div id="bgdim"></div>
<canvas id="game" class="game"></canvas>

  <div class="hudleft"><span id="hudName"></span><br/><span id="hudLives"></span><br/><span id="hudTimer" class="timer"></span></div>
  <div class="progress"><i id="bar"></i></div><div id="pct" class="pct">0%</div>

<script type="module">
(function(){
'use strict';
window.addEventListener('error',function(e){try{console.error(e.error||e.message);var d=document.createElement('div');d.className='err';d.textContent='Something went wrong. Your work is saved. Refresh the page, then tell your teacher if it happens again.';document.body.appendChild(d);setTimeout(function(){d.remove();},7000);}catch(x){}});
function $(s){return document.querySelector(s);}
var ui=$('#ui'),layer=$('#layer'),cv=$('#game'),ctx=cv.getContext('2d');
var C={cyan:'#2ef2ff',pink:'#ff3d81',vio:'#8b5cff',lime:'#b6ff3a',gold:'#ffb531',bg:'#05010f'};
var CELL=44,GROUND=.76,LABCOLS=120,K='ndc:',SKY=13*44;
/* Beat grid: 150 BPM, 1 beat = 4 cells = 176px, so speed 440px/s lands
   every obstacle exactly on a beat. Tap on the beat and you clear it. */
var BPM=150,SPB=60/BPM,BEATCELL=4,SPEED=BEATCELL*CELL/SPB;
var W=0,H=0,D=1,gy=0,last=0;
var mode='menu',paused=false,dead=false,won=false,levelIndex=0,level=null;
var player={x:0,y:0,vy:0,a:0,ground:true,ship:false,hold:false},cam=0,parts=[],flash=0;
var lab=[],labTool='s1',labScroll=0,painting=false,ed=null,ew=0,eh=0,edpr=1,labH=0,objW=2,movePick=null,labUndo=[],labRedo=[];
function snapLab(){return{lab:JSON.parse(JSON.stringify(lab)),cfg:JSON.parse(JSON.stringify(labCfg))};}
function pushUndo(s){labUndo.push(s||snapLab());if(labUndo.length>40)labUndo.shift();labRedo=[];}
function editorUndo(){if(!labUndo.length){toast('Nothing to undo.');return;}labRedo.push(snapLab());var s=labUndo.pop();lab=s.lab;labCfg=s.cfg;saveCfg();queueAuto();openLab();}
function editorRedo(){if(!labRedo.length){toast('Nothing to redo.');return;}labUndo.push(snapLab());var s=labRedo.pop();lab=s.lab;labCfg=s.cfg;saveCfg();queueAuto();openLab();}
var autoRelay=window.__CLASSROOM_SERVER__?((location.protocol==='https:'?'wss://':'ws://')+location.host):
 String((window.NEON_DASH_CONFIG||{}).SERVER_URL||'');
var role=null,meId=null,name='',net=null,students=new Map(),relay=new URLSearchParams(location.search).get('relay')||autoRelay||localStorage.getItem(K+'relay')||'',netStatus=autoRelay?'connecting':'local',rosterPending={};
var CFG=window.NEON_DASH_CONFIG||{};
var cloudUrl=load('cloudUrl','')||String(CFG.DATABASE_URL||'').replace(/\/$/,'');
var cloudRoom=load('cloudRoom','')||String(CFG.CLASSROOM_ID||'')||('CLASS-'+Math.random().toString(36).slice(2,10).toUpperCase());
if(!load('cloudRoom',''))save('cloudRoom',cloudRoom);
if(!load('cloudUrl','')&&cloudUrl)save('cloudUrl',cloudUrl);
function cloudMode(){return !!(cloudUrl&&cloudRoom&&!relay);}
var locked=false,lockText='Eyes on the teacher, please!',teacherMsg='',spot=null,consoleOpen=false,selSeat='',conTab='class';
var pendingLevelCode=(location.hash.match(/(?:^#|&)level=([^&]+)/)||[])[1]||'';
var teacherAuthed=false,loginFails=0,loginLockUntil=0,hostPending=null;
function serverMode(){return !!relay;}

/* =====================================================================
   ACCOUNT STORE - the single source of truth.
   DB.classes[classId]  = {id,name,created,archived}
   DB.students[id]      = {id,classId,name,user,pass,enabled,locked,
                           progress:{...}, data:{...}, lastSeen}
   Saved to localStorage always, mirrored to Firebase when cloud is on.
   ===================================================================== */
var DB={v:1,teacher:{pass:''},classes:{},students:{},activeClass:''},TESTING=false;
var ICON={play:'\u25B6',edit:'\u270E',save:'\uD83D\uDCBE',user:'\uD83D\uDC64',group:'\uD83D\uDC65',
 teach:'\uD83C\uDF93',gear:'\u2699',lock:'\uD83D\uDD12',open:'\uD83D\uDD13',sheet:'\uD83D\uDCCB',
 add:'\u2795',bin:'\uD83D\uDDD1',key:'\uD83D\uDD11',back:'\u2190',ok:'\u2714',star:'\u2B50',reset:'\u21BB'};
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function dbLoad(){
 var d=load('db',null);
 if(d&&d.students&&d.classes)DB=d;
 if(!DB.teacher)DB.teacher={pass:''};
 if(!DB.teacher.pass)DB.teacher.pass=passwordHash(String((window.NEON_DASH_CONFIG||{}).DEFAULT_TEACHER_CODE||'teach123'));
 if(!DB.classes)DB.classes={};
 if(!DB.students)DB.students={};
 if(!DB.levels)DB.levels={};
 if(!DB.mainEdits)DB.mainEdits={};
 if(!DB.activeClass)DB.activeClass='';
}
var openLevelId='',autoTimer=null,autoState='',autoAt=0,syncTimer=null;
function dbSave(){save('db',DB);if(!TESTING)cloudPutRoster();}
function classList(){var a=[];for(var k in DB.classes)if(DB.classes[k]&&!DB.classes[k].archived)a.push(DB.classes[k]);
 a.sort(function(x,y){return (x.name||'').localeCompare(y.name||'');});return a;}
function archivedClasses(){var a=[];for(var k in DB.classes)if(DB.classes[k]&&DB.classes[k].archived)a.push(DB.classes[k]);return a;}
function classStudents(cid){var a=[];for(var k in DB.students){var s=DB.students[k];if(s&&s.classId===cid)a.push(s);}
 a.sort(function(x,y){return (x.n||0)-(y.n||0)||(x.name||'').localeCompare(y.name||'');});return a;}
function newProgress(){return{best:{},completed:[],unlocked:1,attempts:0,plays:0,wins:0,lastLevel:'',lessons:[]};}
function newData(){return{lab:[],labCfg:{ground:0,roof:0},saved:{},pieces:[],
 skin:{shape:'square',col:'#2ef2ff',face:true,trail:'#2ef2ff'},

/* ---------------- network ---------------- */
function Net(url){var me=this;me.cb=function(){};me.bc=null;me.ws=null;me.cloudTimers=[];me.cloudSeen={};me.cloudStarted=Date.now()-1500;me.cloudId=Math.random().toString(36).slice(2)+Date.now().toString(36);
 /* When a server is active, every command must pass through its code check.
    BroadcastChannel is only a zero-server fallback for tabs on one device. */
 if(!serverMode()&&!cloudMode())try{me.bc=new BroadcastChannel('neon-dash-classroom');me.bc.onmessage=function(e){me.cb(e.data);};}catch(e){}
 if(url){netStatus='connecting';try{me.ws=new WebSocket(url);
  me.ws.onopen=function(){netStatus='online';refreshBadges();
   setTimeout(function(){
    var mr0=meRec();
    if(role==='student'&&mr0){me.send({t:'studentauth',id:mr0.id,name:mr0.name});push();}
    else if(role==='teacher'&&teacherAuthed){me.send({t:'who',brief:brief,rules:rules});cloudPutRoster();}
   },0);};
  me.ws.onmessage=function(e){try{me.cb(JSON.parse(e.data));}catch(x){}};
  me.ws.onerror=function(){netStatus='error';refreshBadges();};
   me.ws.onclose=function(){netStatus='error';refreshBadges();};}catch(e){netStatus='error';}}
 if(!url&&cloudMode())me.openCloud();}
function cloudBase(){return String(cloudUrl).replace(/\/$/,'')+'/neondash/'+encodeURIComponent(cloudRoom);}
Net.prototype.cloudFetch=function(path,method,data){return fetch(cloudBase()+'/'+path+'.json'+(method==='PUT'?'?print=silent':''),{
 method:method||'GET',headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data),cache:'no-store'});};
Net.prototype.openCloud=function(){var me=this;netStatus='connecting';refreshBadges();
 function pollMessages(){me.cloudFetch('messages','GET').then(function(r){if(!r.ok)throw new Error('Firebase '+r.status);return r.json();}).then(function(all){
   netStatus='online';refreshBadges();
   if((role==='student'&&!meRec())||(role==='teacher'&&!teacherAuthed))return;
   all=all||{};Object.keys(all).sort().forEach(function(k){var e=all[k];
    if(!e||me.cloudSeen[k])return;me.cloudSeen[k]=1;
    if(e.sender!==me.cloudId&&e.ts>=me.cloudStarted&&e.msg)me.cb(e.msg);});
  }).catch(function(){netStatus='error';refreshBadges();});}
 function pollStudents(){if(role!=='teacher'||!teacherAuthed)return;
  me.cloudFetch('live','GET').then(function(r){if(!r.ok)throw new Error('Firebase '+r.status);return r.json();}).then(function(all){
   netStatus='online';all=all||{};Object.keys(all).forEach(function(k){if(all[k])me.cb({t:'state',s:all[k]});});
  }).catch(function(){netStatus='error';refreshBadges();});}
 function pollAccounts(){if(role!=='teacher'||!teacherAuthed)return;
  me.cloudFetch('accounts','GET').then(function(r){return r.ok?r.json():null;}).then(function(all){
   if(!all)return;
   Object.keys(all).forEach(function(id){var a=all[id],s=DB.students[id];if(!a||!s)return;
    if(a.progress)s.progress=a.progress;if(a.data)s.data=a.data;if(a.lastSeen)s.lastSeen=a.lastSeen;
    if(a.levels){DB.levels=DB.levels||{};for(var lk in a.levels)DB.levels[lk]=a.levels[lk];}});
   save('db',DB);
  }).catch(function(){});}
 function clean(){if(role!=='teacher'||!teacherAuthed)return;
  me.cloudFetch('messages','GET').then(function(r){return r.ok?r.json():null;}).then(function(all){if(!all)return;var patch={},now=Date.now();
   Object.keys(all).forEach(function(k){if(!all[k]||now-(all[k].ts||0)>120000)patch[k]=null;});
   if(Object.keys(patch).length)me.cloudFetch('messages','PATCH',patch);});}
 pollMessages();pollStudents();pollAccounts();
 me.cloudTimers.push(setInterval(pollMessages,700));
 me.cloudTimers.push(setInterval(pollStudents,1200));
 me.cloudTimers.push(setInterval(pollAccounts,2000));
 me.cloudTimers.push(setInterval(clean,30000));};
Net.prototype.send=function(m){
 try{if(this.bc)this.bc.postMessage(m);}catch(e){}
 try{if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify(m));}catch(e){}
 if(cloudMode()){
  if(m.t==='state'&&m.s){this.cloudFetch('live/'+encodeURIComponent(String(m.s.id)),'PUT',m.s).catch(function(){});}
   else this.cloudFetch('messages','POST',{sender:this.cloudId,ts:Date.now(),msg:m}).catch(function(){});
  }};
/* Teacher publishes the class roster; pupils read it so they can log in
   on any device with the same shared link. */
function cloudPutRoster(){
 if(TESTING||!cloudMode()||!net||role!=='teacher')return;
 net.cloudFetch('roster','PUT',{classes:DB.classes,students:slimStudents(),
  levels:sharedLevels(),mainEdits:DB.mainEdits||{},brief:brief,rules:rules,ts:Date.now()}).catch(function(){});}
function cloudPutMe(){
 var s=meRec();if(TESTING||!cloudMode()||!net||!s)return;
 var own={};for(var k in (DB.levels||{})){var L=DB.levels[k];if(L&&L.ownerType==='student'&&L.owner===s.id)own[k]=L;}
 net.cloudFetch('accounts/'+encodeURIComponent(s.id),'PUT',
  {id:s.id,classId:s.classId,progress:s.progress,data:s.data,levels:own,lastSeen:Date.now()}).catch(function(){});}
function cloudGetMe(id,cb){
 if(!cloudMode()||!net)return cb(false);
 net.cloudFetch('accounts/'+encodeURIComponent(id),'GET').then(function(r){return r.ok?r.json():null;}).then(function(a){
  var s=DB.students[id];
  if(a&&s){if(a.progress)s.progress=a.progress;if(a.data)s.data=a.data;if(a.lastSeen)s.lastSeen=a.lastSeen;
   if(a.levels){DB.levels=DB.levels||{};for(var lk in a.levels)DB.levels[lk]=a.levels[lk];}save('db',DB);}
  cb(!!a);
 }).catch(function(){cb(false);});}
function cloudGetRoster(cb){
 if(!cloudMode()||!net)return cb(false);
 net.cloudFetch('roster','GET').then(function(r){return r.ok?r.json():null;}).then(function(d){
  if(!d||!d.students)return cb(false);
  mergeRoster(d.classes,d.students);
  if(d.levels){DB.levels=DB.levels||{};for(var lk in d.levels)DB.levels[lk]=d.levels[lk];}
  if(d.mainEdits)DB.mainEdits=d.mainEdits;
  if(d.brief!=null){brief=String(d.brief);save('brief',brief);}
  if(d.rules){rules=d.rules;save('rules',rules);}
  save('db',DB);cb(true);
 }).catch(function(){cb(false);});}
function serverGetRoster(cb){
 if(!serverMode()||!net)return cb(false);
 var req='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
 rosterPending[req]=cb;net.send({t:'rosterreq',req:req});
 setTimeout(function(){if(rosterPending[req]){delete rosterPending[req];cb(false);}},4000);}
Net.prototype.close=function(){try{if(this.bc)this.bc.close();}catch(e){}try{if(this.ws)this.ws.close();}catch(e){}
 (this.cloudTimers||[]).forEach(function(t){clearInterval(t);});this.cloudTimers=[];};
function connect(){if(!role)return;if(net)net.close();net=new Net(relay);net.cb=onNet;
 if(isTeacher()&&teacherAuthed){net.send({t:'who',brief:brief,rules:rules});setTimeout(cloudPutRoster,600);}
 else if(role==='student'){var mr1=meRec();if(mr1)net.send({t:'studentauth',id:mr1.id,name:mr1.name});push();}}
function onNet(m){if(!m)return;
 if(m.t==='hostres'){if(hostPending)hostPending(m);return;}
 if(m.t==='roster'&&!isTeacher()&&m.classes){mergeRoster(m.classes,m.students);return;}
 if(m.t==='rosterreq'&&isTeacher()&&teacherAuthed&&net){
  net.send({t:'rosterres',req:m.req,classes:DB.classes,students:slimStudents(),levels:sharedLevels(),mainEdits:DB.mainEdits||{}});return;}
 if(m.t==='rosterres'&&m.req&&rosterPending[m.req]){
  mergeRoster(m.classes,m.students);
  if(m.levels){DB.levels=DB.levels||{};for(var rk in m.levels)DB.levels[rk]=m.levels[rk];}
  if(m.mainEdits)DB.mainEdits=m.mainEdits;save('db',DB);
  var cb0=rosterPending[m.req];delete rosterPending[m.req];cb0(true);return;}
 /* level sharing by word code - works for everyone, any role */
 if(m.t==='pub'&&m.code){pubs[m.code]=m.data;save('pubs',pubs);return;}
 if(m.t==='get'&&m.code){if(pubs[m.code]&&net)net.send({t:'got',code:m.code,data:pubs[m.code]});return;}
 if(m.t==='got'&&m.code){if(pendingGet&&pendingGet.code===m.code&&!pendingGet.done){
  pendingGet.done=true;pubs[m.code]=m.data;save('pubs',pubs);
  var f=pendingGet.cb;pendingGet=null;f(m.data);}return;}
 if(m.t==='roster'&&!isTeacher()&&m.classes){DB.classes=m.classes;DB.students=m.students||{};save('db',DB);return;}
 if(isTeacher()&&m.t==='state'){var first=!students.has(m.s.id);students.set(m.s.id,m.s);
  /* mirror live progress into the account record - single source of truth */
  var rec=DB.students[m.s.id];
  if(rec){rec.lastSeen=Date.now();if(m.s.progress)rec.progress=m.s.progress;save('db',DB);}
  if(first&&net){cmd(m.s.id,{c:'brief',text:brief,show:false});cmd(m.s.id,{c:'rules',rules:rules});cmd(m.s.id,{c:'gfx',name:gfxName});cmd(m.s.id,{c:'levels'});cmd(m.s.id,{c:'classSettings',settings:classSettings(m.s.classId)});
   if(race)cmd(m.s.id,{c:'race',id:race.id,kind:race.kind,idx:race.idx,code:race.code,title:race.title,started:race.started});}
  if(race&&!raceWinner&&m.s.raceId===race.id&&m.s.raceDone){raceWinner=m.s.name||'A pupil';cmdClass({c:'racewin',name:raceWinner});}
  if(consoleOpen&&(conTab==='class'||conTab==='race'))renderConsole();return;}
 if(!isTeacher()&&m.t==='who'){if(m.brief){brief=m.brief;save('brief',brief);}if(m.rules){rules=m.rules;save('rules',rules);}push();return;}
 if(!isTeacher()&&m.t==='cmd'&&(m.target==='all'||m.target===meId)){
  if(cloudMode()&&m.auth!==commandToken)return;
  doCmd(m.cmd);}}
function push(){var s=meRec();
 if(role!=='student'||!net||!s)return;
 net.send({t:'state',s:{id:s.id,classId:s.classId,name:s.name,user:s.user,screen:mode,levelName:(level&&level.title)||LEVELS[levelIndex].name,
 lives:lives,edits:edits,tested:tested,need:rules.edits,playLeft:Math.round(playLeft),designLock:designLock,locked:locked,
 attempts:attempt,pieces:lab.length,progress:s.progress,code:lab.length?encode(lab):'',
 raceId:race?race.id:'',racePct:racePct,raceDone:raceDone,raceTime:raceTime,raceDeaths:raceDeaths,ts:Date.now()}});}
setInterval(function(){push();if(role==='student')saveMe();},1500);
function sharedLevels(){var o={};
 for(var k in (DB.levels||{})){var L=DB.levels[k];
  if(L&&L.ownerType==='teacher'&&(L.vis==='published'||L.vis==='class'))o[k]=L;}
 return o;}
function levelsForClass(cid){var o={};
 for(var k in (DB.levels||{})){var L=DB.levels[k];
  if(!L||L.ownerType!=='teacher')continue;
  if(L.vis==='published'||(L.vis==='class'&&L.classId===cid))o[k]=L;}
 return o;}
function cmd(target,c){if(!net)return;
 if(c&&c.c==='levels'){
  var targetStudent=target!=='all'?DB.students[target]:null;
  c.levels=targetStudent?levelsForClass(targetStudent.classId):sharedLevels();
  c.mainEdits=DB.mainEdits||{};}
 net.send({t:'cmd',target:target,cmd:c,auth:commandToken});}
function cmdClass(c){classStudents(DB.activeClass).forEach(function(s){cmd(s.id,c);});}
function syncLevelsAll(){for(var id in DB.students)if(DB.students[id])cmd(id,{c:'levels'});}
function scheduleLevelSync(){if(syncTimer)clearTimeout(syncTimer);syncTimer=setTimeout(syncLevelsAll,650);}
function saveClassSettings(){var c=DB.classes[DB.activeClass];if(!c)return;
 var s=ensureClassSettings(c);s.rules=JSON.parse(JSON.stringify(rules));s.brief=brief;s.gfx=gfxName;s.bg=JSON.parse(JSON.stringify(bgCfg));
 dbSave();}
function loadClassSettings(id){var c=DB.classes[id],s=c&&c.settings;if(!s)return;
 s=ensureClassSettings(c);
 if(s.rules)rules=s.rules;if(s.brief!=null)brief=s.brief;if(s.gfx)setGfx(s.gfx);if(s.bg){bgCfg=s.bg;applyBg();}}
function doCmd(c){
 if(c.c==='classSettings'&&c.settings){var cc=DB.classes[myClass()];if(cc){cc.settings=c.settings;save('db',DB);}if(mode==='hub')renderHub(hubTab);toast('Class settings updated.');return;}
 if(c.c==='ownedLevel'&&c.level){
  if(c.level.owner!==meId)return;
  DB.levels=DB.levels||{};DB.levels[c.level.id]=c.level;save('db',DB);
  if(mode==='hub')renderHub(hubTab);return;}
 if(c.c==='account'&&c.account){var mine=meRec();
  if(!mine||c.account.id!==mine.id)return;
  mine.classId=c.account.classId;mine.name=c.account.name;mine.user=c.account.user;
  if(c.account.passHash)mine.passHash=c.account.passHash;
  mine.enabled=c.account.enabled;mine.locked=c.account.locked;name=mine.name;locked=!!mine.locked;save('db',DB);
  if(mine.enabled===false){alert('Your teacher has disabled this account.');logoutNow();return;}
  if(mode==='menu'||mode==='hub')renderHub(hubTab);else refreshBadges();return;}
 if(c.c==='deleted'){alert('This account was removed by your teacher.');logoutNow();return;}
 if(c.c==='lock'){locked=c.on;if(c.text)lockText=c.text;if(locked&&mode==='play')paused=true;refreshBadges();}
 else if(c.c==='goto'){if(c.screen==='lab')enterLab();else if(c.screen==='lessons')openLessons();else renderMenu();}
 else if(c.c==='msg'){teacherMsg=c.text;refreshBadges();setTimeout(function(){teacherMsg='';refreshBadges();},9000);}
 else if(c.c==='push'){var p=decode(c.code);if(p){lab=p.slice();if(p.cfg){labCfg=p.cfg;saveCfg();}persist();openLab();toast('Your teacher sent you a level!');}}
 else if(c.c==='spot'){spot=c;refreshBadges();}
 else if(c.c==='unspot'){spot=null;refreshBadges();}
 else if(c.c==='rules'){rules=c.rules;persist();if(mode==='lab')openLab();refreshBadges();}

 else if(c.c==='gfx'){setGfx(c.name);toast('Graphics set to '+gfx.name+'.');if(mode==='menu')renderMenu();}
 else if(c.c==='bg'){if(c.cfg){bgCfg=c.cfg;applyBg();toast('Your teacher changed the background.');}}
 else if(c.c==='race')startRace(c);
 else if(c.c==='raceend'){if(race){var w=c.name?('Winner: '+c.name):'Race finished';toast(w);quitRace();}}
 else if(c.c==='racewin'){raceWinner=c.name||'';if(mode==='racedone')raceFinish(true);else toast('FIRST PLACE: '+raceWinner);}
 else if(c.c==='brief'){brief=c.text;save('brief',brief);if(c.show||showBrief)renderEntryMessage();else toast('Your teacher updated the entry message.');}
 else if(c.c==='showbrief')renderEntryMessage();
 else if(c.c==='grant'){lives+=c.n;designLock=false;persist();toast('Teacher gave you '+c.n+' more lives!');if(mode==='lab')openLab();refreshBadges();}
 else if(c.c==='refill')refill(true);
 else if(c.c==='design'){lives=0;designLock=true;persist();toast('Design time! Improve your level.');enterLab();}
 else if(c.c==='reset'){lab=[];lives=rules.lives;edits=0;tested=0;playLeft=rules.minutes*60;designLock=false;
  var mr=meRec();if(mr){mr.progress=newProgress();mr.data=newData();save('db',DB);}
  persist();toast('Your teacher reset your progress.');renderMenu();}
 else if(c.c==='unlocked'){var m2=meRec();if(m2){m2.progress=m2.progress||newProgress();m2.progress.unlocked=c.n;save('db',DB);}toast('New level unlocked!');}
 else if(c.c==='levels'&&c.levels){
  /* teacher levels arrive; pupils never receive private ones */
  for(var lk in c.levels){var inL=c.levels[lk];
   if(inL&&inL.ownerType==='teacher')DB.levels[lk]=inL;}
  /* drop any teacher level the teacher has since made private/deleted */
  for(var ek in DB.levels){var exL=DB.levels[ek];
   if(exL&&exL.ownerType==='teacher'&&!c.levels[ek])delete DB.levels[ek];}
  if(c.mainEdits)DB.mainEdits=c.mainEdits;
  save('db',DB);if(mode==='hub')renderHub();toast('Your teacher updated the levels.');}
 else if(c.c==='rename'){var m3=meRec();if(m3){m3.name=c.name;name=c.name;save('db',DB);}refreshBadges();if(mode==='menu')renderMenu();}
 if(role==='student')saveMe();
 push();}

/* ---------------- lives cycle ---------------- */
function canPlay(){return isTeacher()||(!designLock&&lives>0&&playLeft>0);}
function spendLife(){if(isTeacher())return;lives--;if(lives<=0){lives=0;designLock=true;}persist();}
function checkTimer(){if(isTeacher())return;if(playLeft<=0&&!designLock){designLock=true;persist();}}
function progressOk(){return edits>=rules.edits&&(!rules.needTest||tested>=1);}
function refill(force){lives=rules.lives;playLeft=rules.minutes*60;edits=0;tested=0;designLock=false;persist();
 toast(force?'Teacher refilled your lives!':'Great designing! '+rules.lives+' new lives unlocked.');
 if(mode==='lab')openLab();refreshBadges();push();}
function noteEdit(){if(isTeacher())return;edits++;persist();if(designLock&&progressOk())refill(false);}
function noteTest(){if(isTeacher())return;tested++;persist();if(designLock&&progressOk())refill(false);}

/* ---------------- levels ---------------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function generatedMain(i){var o=[],col=8,r=rng(9321+i*77),L=LEVELS[i],B=BEATCELL;
 for(var n=0;n<40+i*6;n++){
  if(i===3&&(n===10||n===22)){o.push({t:'grav',x:col*CELL});col+=B*3;continue;}
  if(i===4&&n===12){o.push({t:'spd1',x:col*CELL});col+=B*2;continue;}
  if(i===4&&n===34){o.push({t:'spd0',x:col*CELL});col+=B*2;continue;}
  if(L.ship&&(n===14||n===32)){
   o.push({t:'ship',x:col*CELL});
   var len=B*6;
   for(var j=B*2;j<len-B;j+=B*2)o.push({t:(j/(B*2))%2?'s1':'b2',x:(col+j)*CELL});
   col+=len;o.push({t:'cube',x:col*CELL});col+=B*2;continue;}
  var k=n%12,t=k===0?'pit':k===3?'b1':k===6?'s2':k===9?'s3':r()<.22?'b2':'s1';
  o.push({t:t,x:col*CELL});
  /* gaps are whole beats: 2 beats normally, 3 for a breather, 1 for a
     quick double that clears in a single jump */
  var beats=(n>26&&n%8<3)?1:(r()<.25?3:2);
  col+=beats*B;}
 return{obs:o,end:(col+B*2)*CELL,speed:L.speed,custom:false};}
function levelToLab(lv){return(lv.obs||[]).map(function(o){
 return{t:o.t,col:Math.round(o.x/CELL)};
}).filter(function(p){return TOOLS.some(function(t){return t[0]===p.t;});});}
function makeLevel(i){
 var ov=mainOverride(i);
 if(ov&&ov.lab&&ov.lab.length){var L=levelFrom(ov.lab,ov.cfg||{ground:0,roof:0});L.custom=false;L.mainIndex=i;return L;}
 return generatedMain(i);}
function levelFrom(arr,cfg){cfg=cfg||labCfg;
 var o=expand((arr||[]).slice().sort(function(a,b){return a.col-b.col;}),cfg.ground||0);
 o.sort(function(a,b){return a.x-b.x;});
 var fin=(LABCOLS-6)*CELL;o.forEach(function(x){if(x.t==='finish')fin=Math.min(fin,x.x);});
 return{obs:o,end:fin,speed:SPEED,custom:true,
  floor:(cfg.ground||0)*CELL,roof:cfg.roof?(cfg.ground||0)*CELL+cfg.roof*CELL:0};}

function drawShape(c2,shape,size,col,glow){
 var h=size/2;c2.fillStyle=col;
 if(glow){c2.shadowColor=col;c2.shadowBlur=glow;}

 else if(shape==='triangle'){c2.moveTo(0,-h);c2.lineTo(h,h);c2.lineTo(-h,h);c2.closePath();}
 else if(shape==='star'){for(var i=0;i<10;i++){var a=Math.PI/5*i-Math.PI/2,r=i%2?h*.45:h;
  if(i)c2.lineTo(Math.cos(a)*r,Math.sin(a)*r);else c2.moveTo(Math.cos(a)*r,Math.sin(a)*r);}c2.closePath();}
 else if(shape==='rounded'){rr(c2,-h,-h,size,size,size*.3);}

 c2.fill();}

var PIECES=load('pieces',[]);

function pieceById(id){for(var i=0;i<PIECES.length;i++)if(PIECES[i].id===id)return PIECES[i];return null;}
function pieceW(p){var w=1;p.cells.forEach(function(c){if(c.cx+1>w)w=c.cx+1;});return w;}
function toolW(t){if(t.indexOf('c:')===0){var p=pieceById(t.slice(2));return p?pieceW(p):1;}
 var w=1;TOOLS.forEach(function(x){if(x[0]===t)w=x[2];});return w;}
var labCfg=load('labCfg',{ground:0,roof:0});
function saveCfg(){save('labCfg',labCfg);}
function expand(arr,fc){fc=fc||0;var out=[];
 (arr||[]).forEach(function(p){
  var t=String(p.t),h=p.h||0;
  if(t.indexOf('c:')===0){var pc=pieceById(t.slice(2));
   if(pc)pc.cells.forEach(function(c){out.push({t:c.k==='s'?'S':'B',x:(p.col+c.cx)*CELL,r:fc+h+c.cy});});
   return;}
  if(t.indexOf('pad')===0){out.push({t:'P',x:p.col*CELL,r:fc+h,v:PADV[t]||1450});return;}
  if(t==='mov'){out.push({t:'M',x:p.col*CELL,r:fc+h,w:Math.max(1,Math.min(4,p.w||2)),a:Math.max(1,p.a||2),phase:p.phase||0});return;}
  if(t==='grav'){out.push({t:'grav',x:p.col*CELL});return;}
  if(t==='spd1'||t==='spd0'){out.push({t:t,x:p.col*CELL});return;}
  if(t==='finish'){out.push({t:'finish',x:p.col*CELL});return;}
  if(t==='decor'||t==='bgstar'){out.push({t:t,x:p.col*CELL,r:fc+h});return;}
  if(h>0&&t!=='pit'&&t!=='ship'&&t!=='cube'){
   /* floating obstacle: emit per-cell pieces at the chosen height */
   if(t[0]==='s'){var n=+t[1];
    for(var i=0;i<n;i++)out.push({t:'S',x:(p.col+i)*CELL,r:fc+h});}
   else if(t==='b1'||t==='b2'){var m=t==='b2'?2:1;
    for(var j=0;j<m;j++)out.push({t:'B',x:p.col*CELL,r:fc+h+j});}

  out.push({t:t,x:p.col*CELL});});

/* Rectangle vs triangle. A spike is a triangle with its base at y0 and
   apex CELL above. The widest part inside the player's vertical range is
   at the lowest overlapping point, so we measure the triangle there.
   SHRINK makes the hitbox smaller than the drawing, like real GD, so
   clipping the very edge of a spike does not kill you. */
var SHRINK=.58;
function spikeHit(pl,pr,pb,pt,x0,y0){
 var apex=y0+CELL;
 if(pb>=apex||pt<=y0)return false;              /* fully above or below */
 var yT=Math.max(pb,y0);                         /* lowest overlapping row */
 var frac=1-(yT-y0)/CELL;                        /* 1 at base, 0 at apex */
 var half=(CELL/2)*frac*SHRINK;
 if(half<=0)return false;
 var cx=x0+CELL/2;
 return pl<cx+half&&pr>cx-half;}
/* ---------------- collision probe (shared by game + solver) ---------------- */
function probe(lv,px,py,vy,ship,prevY){
 var obs=lv.obs,fl=lv.floor||0;
 if(prevY===undefined)prevY=py;
 var pl=px-CELL*.32,pw=CELL*.64,pr2=pl+pw,pb=py+CELL*.1,ph=CELL*.78,pt=pb+ph;
 var land=null,ceil=null,pad=null;
 /* PASS 1 - solid things only. We must know whether the player lands on a
    block BEFORE testing spikes, otherwise a spike hidden under that block
    kills a player who actually landed safely on top of it. */
 for(var i=0;i<obs.length;i++){var o=obs[i];
  if(o.x-px>CELL*4)break;
  if(px-o.x>CELL*4||o.t==='ship'||o.t==='cube')continue;
  if(o.t==='P'){
   if(box(pl,pb,pw,ph,o.x+3,o.r*CELL,CELL-6,CELL*.5))pad=o.v;
   continue;}
  if(o.t==='pit'){if(!ship&&px>o.x+4&&px<o.x+CELL*3-4&&py<=fl)return{die:true};continue;}
  var bx,by,bh,bw=CELL;
  if(o.t==='b1'||o.t==='b2'){bx=o.x;by=fl;bh=(o.t==='b2'?2:1)*CELL;}
  else if(o.t==='B'){bx=o.x;by=o.r*CELL;bh=CELL;}
  else if(o.t==='M'){bx=o.x;by=o.dynY==null?o.r*CELL:o.dynY;bh=CELL;bw=CELL*(o.w||2);}
  else continue;
  var top=by+bh,tol=CELL*.45;
  /* Landing counts if we are near the top OR if we crossed straight
     through it this frame (fast falls off a high jump pad). */
  var horizontal=pl<bx+bw&&pr2>bx;
  var onTop=horizontal&&vy<=0&&py<=top&&prevY>=top-tol;
  var underIt=horizontal&&vy>=0&&py+CELL>=by&&prevY+CELL<=by+tol;
  if(onTop){if(land===null||top>land)land=top;continue;}
  if(underIt){if(ceil===null||by<ceil)ceil=by;continue;}
  if(!box(pl,pb,pw,ph,bx,by,bw,bh))continue;
  /* Anything else is a genuine side-on hit. */
  return{die:true};}
 /* PASS 2 - spikes, tested from where the player actually ends up.
    Standing on a block lifts the body clear of anything beneath it. */
 var ey=land!==null?land:(ceil!==null?ceil-CELL:py);
 var eb=ey+CELL*.1,et=eb+ph;
 for(var j2=0;j2<obs.length;j2++){var s2=obs[j2];
  if(s2.x-px>CELL*4)break;
  if(px-s2.x>CELL*4)continue;
  if(s2.t==='s1'||s2.t==='s2'||s2.t==='s3'){var n2=+s2.t[1];
   for(var q2=0;q2<n2;q2++)if(spikeHit(pl,pr2,eb,et,s2.x+q2*CELL,fl))return{die:true};}
  else if(s2.t==='S'){if(spikeHit(pl,pr2,eb,et,s2.x,s2.r*CELL))return{die:true};}}
 if(pad!==null)return{die:false,land:null,ceil:null,pad:pad};
 return{die:false,land:land,ceil:ceil};}

/* ---------------- solvability checker ---------------- */
function solvable(lv){
 var dt=1/60,sp=lv.speed,step=sp*dt,frames=Math.ceil(lv.end/step)+4;
 if(frames>3000)return{ok:true,x:lv.end};
 var obs=lv.obs,cur={},best=0,CAP=520,fl=lv.floor||0,rf=lv.roof||0;
 cur[fl+'|0|1|0']={y:fl,vy:0,g:1,sh:0};
 for(var f=0;f<frames;f++){
  var x=f*step;if(x>=lv.end)return{ok:true,x:lv.end};
  var nx={},count=0,empty=true;
  for(var key in cur){
   if(count>CAP)break;
   var s=cur[key];
   for(var hh=0;hh<2;hh++){
    var y=s.y,vy=s.vy,g=s.g,sh=s.sh,hold=hh===1,nxx=x+step,i;
    for(i=0;i<obs.length;i++){var o=obs[i];
     if(o.x>x&&o.x<=nxx){if(o.t==='ship'){sh=1;y=fl+CELL*2.8;vy=0;}else if(o.t==='cube'){sh=0;vy=0;}}}
    if(sh){vy+=(hold?2500:-2300)*dt;if(vy<-410)vy=-410;if(vy>340)vy=340;y+=vy*dt;
     var cy2=rf||(fl+SKY);
     if(y<fl){y=fl;vy=0;}
     else if(y+CELL>cy2){y=cy2-CELL;vy=0;}}
    else{vy-=3400*dt;y+=vy*dt;
     var cap=rf||(fl+SKY);
     if(y+CELL>cap){y=cap-CELL;if(vy>0)vy=0;}
     if(y<=fl){y=fl;vy=0;g=1;}else g=0;}
    var r=probe(lv,nxx,y,vy,sh,s.y);
    if(r.die)continue;
    if(r.pad&&!sh){vy=r.pad;g=0;}
    else if(r.land!==null){y=r.land;if(vy<0)vy=0;if(!sh)g=1;}
    else if(r.ceil!==null){y=r.ceil-CELL;if(vy>0)vy=0;}
    /* hold-to-jump resolves after landing, matching the live game */
    if(!sh&&g&&hold){vy=900;g=0;}
    var qy=Math.round(y/4),qv=Math.round(vy/70),k=qy+'|'+qv+'|'+g+'|'+sh;
    if(!nx[k]){nx[k]={y:y,vy:vy,g:g,sh:sh};count++;empty=false;}}}
  if(empty)return{ok:false,x:x};
  cur=nx;best=x;}
 return{ok:best>=lv.end*.98,x:best};}

/* ---------------- simulation ---------------- */
function update(dt){

  if(o.t==='ship'){p.ship=true;p.y=(level.floor||0)+CELL*2.8;p.vy=0;flash=.3;burst(p.x,p.y,C.cyan,20);}
  if(o.t==='cube'){p.ship=false;p.vy=0;flash=.3;burst(p.x,p.y,C.pink,20);}
  if(o.t==='grav'&&!p.ship){p.flip=!p.flip;p.vy=0;p.ground=false;flash=.3;burst(p.x,p.y+CELL/2,C.vio,18);}
  if(o.t==='spd1'){p.spd=1.35;flash=.15;}
  if(o.t==='spd0'){p.spd=1;flash=.15;}}});
 level.obs.forEach(function(o){if(o.t==='M')o.dynY=(o.r+Math.sin(Date.now()/700+(o.phase||0))*o.a)*CELL;});
 var fl=level.floor||0,rf=level.roof||0;
 p.py0=p.y;
 if(p.ship){p.vy+=(p.hold?2500:-2300)*dt;p.vy=Math.max(-410,Math.min(340,p.vy));p.y+=p.vy*dt;
  p.a+=(Math.max(-.72,Math.min(.72,-p.vy*.0019))-p.a)*Math.min(1,dt*11);
  if(Math.random()<(p.hold?.95:.55)*gfx.parts)parts.push({x:p.x-24,y:p.y+22,
   vx:-260-Math.random()*150,vy:(Math.random()-.5)*80,life:.28,size:(p.hold?5:3)+Math.random()*5,
   c:p.hold?C.gold:C.pink});

  if(p.y<fl){p.y=fl;p.vy=0;
   if(Math.random()<.5*gfx.parts)parts.push({x:p.x-10,y:fl+3,vx:-200-Math.random()*160,vy:40+Math.random()*70,life:.22,size:3+Math.random()*4,c:C.cyan});}
  else if(p.y+CELL>ceilY){p.y=ceilY-CELL;p.vy=0;
   if(Math.random()<.5*gfx.parts)parts.push({x:p.x-10,y:ceilY-3,vx:-200-Math.random()*160,vy:-40-Math.random()*70,life:.22,size:3+Math.random()*4,c:C.pink});}}
  else{var capY=rf||(fl+SKY);p.wasG=p.ground;
   if(!p.flip){p.vy-=3400*dt;p.y+=p.vy*dt;
    if(p.y+CELL>capY){p.y=capY-CELL;if(p.vy>0)p.vy=0;}
    if(p.y<=fl){p.y=fl;p.vy=0;p.ground=true;}else p.ground=false;}
   else{p.vy+=3400*dt;p.y+=p.vy*dt;
    if(p.y<fl){p.y=fl;if(p.vy<0)p.vy=0;}

 var f=Math.min(1,p.x/level.end),b=$('#bar'),pc=$('#pct');if(b)b.style.width=f*100+'%';if(pc)pc.textContent=Math.floor(f*100)+'%';

function botThink(p,sp){

  burst(p.x,p.y+6,C.lime,10);flash=Math.max(flash,.14);return;}

  p:Object.keys(used).map(function(id){return [id,used[id].name,used[id].cells.map(function(c){return [c.cx,c.cy,c.k];})];})};
 return btoa(unescape(encodeURIComponent(JSON.stringify(pk)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){return '';}}
function decode(s){try{var b=String(s).trim().replace(/-/g,'+').replace(/_/g,'/');

 var arr,cfg={ground:0,roof:0};
 if(Array.isArray(raw))arr=raw;
 else{arr=raw.c||[];cfg={ground:raw.g||0,roof:raw.r||0};
  (raw.p||[]).forEach(function(d){if(!pieceById(d[0])){PIECES.push({id:d[0],name:d[1],
   cells:(d[2]||[]).map(function(c){return{cx:c[0],cy:c[1],k:c[2]};})});}});
  if(raw.p&&raw.p.length)savePieces();}
 var out=arr.map(function(x){var o={t:x[0],col:+x[1]};if(x[2])o.h=+x[2];return o;}).filter(function(x){
  var okTool=TOOLS.some(function(t){return t[0]===x.t;})||(String(x.t).indexOf('c:')===0&&pieceById(String(x.t).slice(2)));

   Four game words instead of a long jumble. The level travels over the
   class connection, so anyone in the room can type the words and play. */
var WORDS=['SPIKE','BLOCK','TOWER','TRIO','DUO','PAD','SHIP','CUBE','GAP','DASH',
 'NEON','JUMP','WAVE','BEAT','GRID','LASER','ORBIT','PULSE','ROCKET','STAR',
 'STORM','TURBO','VOLT','ZONE','COMET','NOVA','PRISM','QUARTZ','RIFT','SOLAR',
 'TITAN','VAPOR','ZAP','ATOM','BOLT','CIRCUIT','DRIFT','ECHO','FLARE','GLIDE',
 'HELIX','IMPULSE','JETPACK','KRYPTON','LUNAR','MAGNET','NEBULA','ONYX','PIXEL','QUEST',
 'RADAR','SPARK','THRUST','ULTRA','VECTOR','WARP','XENON','YONDER','ZENITH','ANCHOR',
 'BRIDGE','CANYON','DELTA','EMBER'];
var pubs={},pendingGet=null;
function wordCode(){var a=[];for(var i=0;i<4;i++)a.push(WORDS[Math.floor(Math.random()*WORDS.length)]);return a.join(' ');}
function normCode(s){return String(s||'').toUpperCase().replace(/[^A-Z ]+/g,' ').split(/\s+/).filter(Boolean).join(' ');}
function isWordCode(s){var p=normCode(s).split(' ');
 return p.length===4&&p.every(function(w){return WORDS.indexOf(w)>=0;});}
function publishLevel(){
 if(!lab.length){alert('Build a level first.');return;}
 var code=wordCode(),data=encode(lab);
 pubs[code]=data;save('pubs',pubs);
 if(net)net.send({t:'pub',code:code,data:data});
 return code;}
function fetchByWords(code,cb){
 code=normCode(code);
 if(pubs[code])return cb(pubs[code]);
 var cached=load('pubs',{})||{};
 if(cached[code])return cb(cached[code]);
 if(!net){cb(null);return;}
 pendingGet={code:code,cb:cb,done:false};
 net.send({t:'get',code:code});
 setTimeout(function(){if(pendingGet&&pendingGet.code===code&&!pendingGet.done){
  var f=pendingGet.cb;pendingGet=null;f(null);}},3000);}

  .then(function(text){dl('classroom-server.mjs',text,'text/javascript');})

  .catch(function(){alert('The HTML file is not available from this host. Use the index.html file from the project folder.');});}

/* ---------------- built-in beat track (150 BPM, synced to the level) ----
   Every kick drum lands exactly where an obstacle can appear, so pupils
   can learn to tap on the beat instead of reacting late. ---------------- */
var A=null,NB=null,syn={on:false,step:0,next:0,timer:null,g:null};
var STEP=SPB/4;
var useSynth=load('useSynth',true);
function aCtx(){if(!A){try{A=new (window.AudioContext||window.webkitAudioContext)();}catch(e){A=null;}}return A;}
function nbuf(){if(NB)return NB;var n=Math.floor(A.sampleRate*.4),b=A.createBuffer(1,n,A.sampleRate),d=b.getChannelData(0);
 for(var i=0;i<n;i++)d[i]=Math.random()*2-1;NB=b;return b;}
function kick(t){var o=A.createOscillator(),g=A.createGain();
 o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(45,t+.09);
 g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);
 o.connect(g);g.connect(syn.g);o.start(t);o.stop(t+.26);}
function hat(t,open){var s=A.createBufferSource();s.buffer=nbuf();
 var f=A.createBiquadFilter();f.type='highpass';f.frequency.value=7600;
 var g=A.createGain();g.gain.setValueAtTime(open?.22:.13,t);
 g.gain.exponentialRampToValueAtTime(.001,t+(open?.17:.05));
 s.connect(f);f.connect(g);g.connect(syn.g);s.start(t);s.stop(t+.22);}
function snare(t){var s=A.createBufferSource();s.buffer=nbuf();
 var f=A.createBiquadFilter();f.type='bandpass';f.frequency.value=1900;
 var g=A.createGain();g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
 s.connect(f);f.connect(g);g.connect(syn.g);s.start(t);s.stop(t+.18);}
function bass(t,f,d){var o=A.createOscillator(),g=A.createGain(),lp=A.createBiquadFilter();
 o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';
 lp.frequency.setValueAtTime(1100,t);lp.frequency.exponentialRampToValueAtTime(260,t+d);
 g.gain.setValueAtTime(.34,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(lp);lp.connect(g);g.connect(syn.g);o.start(t);o.stop(t+d+.02);}
function lead(t,f,d,v){var o=A.createOscillator(),g=A.createGain();
 o.type='square';o.frequency.value=f;
 g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(syn.g);o.start(t);o.stop(t+d+.02);}
/* Am - F - C - G, the classic Newgrounds/GD progression */
var ROOTS=[55,43.65,65.41,49];
/* 16-step hook per bar. 0 = rest. Written to sit on the jump beats. */
var HOOK=[
 [440,0,523.25,0, 659.25,0,523.25,0, 440,0,392,0, 440,0,0,0],
 [349.23,0,440,0, 523.25,0,440,0, 349.23,0,329.63,0, 349.23,0,0,0],
 [523.25,0,659.25,0, 783.99,0,659.25,0, 523.25,0,493.88,0, 523.25,0,0,0],
 [493.88,0,587.33,0, 493.88,0,392,0, 440,0,493.88,0, 587.33,0,659.25,0]];
var STAB=[220,174.61,261.63,196];
function saw2(t,f,d,v){ /* detuned pair = thick supersaw lead */
 [-7,7].forEach(function(c){var o=A.createOscillator(),g=A.createGain();
  o.type='sawtooth';o.frequency.value=f;o.detune.value=c;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);
  g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(syn.g);o.start(t);o.stop(t+d+.02);});}
/* 256 steps = 16 bars. Structure like a real GD song:
   bars 0-3 intro (drums + bass), 4-11 main drop (full hook),
   bars 12-13 breakdown (lead only), 14-15 build back into the loop. */
function synStep(s,t){
 var barN=Math.floor(s/16),br=barN%4,ib=s%16;
 var intro=barN<4,brk=barN===12||barN===13,build=barN>=14;
 /* drums */
 if(!brk&&ib%4===0)kick(t);
 if(!brk&&!intro&&(ib===4||ib===12))snare(t);
 if(!brk&&ib%2===1)hat(t,ib===15);
 if(build&&ib%2===0)snare(t);            /* snare roll into the drop */
 /* sidechain pump on every kick */
 if(!brk&&ib%4===0&&syn.g){var g=syn.g.gain,v=musicVol*.75;
  g.cancelScheduledValues(t);g.setValueAtTime(v*.45,t);g.linearRampToValueAtTime(v,t+SPB*.55);}
 /* bass */
 var r=ROOTS[br];
 if(!brk){if(ib%4===0)bass(t,r,.16);if(ib%4===2&&!intro)bass(t,r*2,.11);}
 /* lead hook - the memorable part */
 if(!intro){var n=HOOK[br][ib];
  if(n)saw2(t,n,ib%4===0?.28:.18,brk?.055:.08);}
 /* chord stab */
 if(!brk&&!intro&&ib===0)lead(t,STAB[br],.3,.05);
 if(build&&ib===15)lead(t,STAB[0]*2,.25,.09);}
function synTick(){if(!A||!syn.on)return;
 while(syn.next<A.currentTime+.15){synStep(syn.step,syn.next);syn.next+=STEP;syn.step=(syn.step+1)%256;}}
function synStart(){
 if(!useSynth||musicIndex>=0||(bgCfg.type==='youtube'&&bgCfg.ytAudio))return;
 var c=aCtx();if(!c||syn.on)return;
 if(c.state==='suspended')c.resume();
 syn.g=c.createGain();syn.g.gain.value=musicVol*.75;syn.g.connect(c.destination);
 syn.on=true;syn.step=0;syn.next=c.currentTime+.08;

/* Phase-lock the beat to the player's position in the level.
   Obstacles sit on 4-cell beats. The ideal moment to tap is about 2 cells
   BEFORE an obstacle (the jump arc carries you 5.3 cells), so we place the
   kick drum there. Tap on the kick and you clear the obstacle. */
function synAlign(reset){
 if(!A||!syn.on)return;
 var cellPos=(player.x||0)/CELL;
 var k=Math.ceil((cellPos-2)/BEATCELL-1e-6);
 var nextKick=2+k*BEATCELL;
 var wait=(nextKick-cellPos)*CELL/SPEED;
 while(wait<.03){nextKick+=BEATCELL;wait=(nextKick-cellPos)*CELL/SPEED;}
 syn.step=reset?0:(Math.ceil(syn.step/4)*4)%256;
 syn.next=A.currentTime+wait;}
function synStop(){syn.on=false;if(syn.timer)clearInterval(syn.timer);syn.timer=null;
 if(syn.g){try{syn.g.disconnect();}catch(e){}syn.g=null;}}
function synVol(){if(syn.g&&A){try{syn.g.gain.cancelScheduledValues(A.currentTime);
 syn.g.gain.setValueAtTime(musicVol*.75,A.currentTime);}catch(e){}}}
